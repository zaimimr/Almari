appId: com.zaimimran.almari
---
- launchApp
- tapOn: "Your style answers"
- assertVisible: "Hijab and coverage"
- takeScreenshot: planning/build/onboarding/answers-large-1
- scrollUntilVisible:
    element: "Change: Colours"
    direction: DOWN
- takeScreenshot: planning/build/onboarding/answers-large-2
- scrollUntilVisible:
    element: "Change: Body"
    direction: UP
- tapOn: "Change: Body"
- assertNotVisible: "Skip"
- takeScreenshot: planning/build/onboarding/answers-large-body
- tapOn: "Cancel"
