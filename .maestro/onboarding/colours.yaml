appId: com.zaimimran.almari
---
- launchApp:
    clearState: true
- repeat:
    times: 4
    commands:
      - scrollUntilVisible:
          element: "Skip"
          direction: DOWN
      - tapOn: "Skip"
- assertVisible: "Step 5 of 6"
- scrollUntilVisible:
    element: "Take a selfie"
    direction: DOWN
- tapOn: "Take a selfie"
- assertVisible: "Wearing a hijab is fine. Hair is then left out."
- scrollUntilVisible:
    element: "The photo is deleted right after. Only the measured colours are kept."
    direction: DOWN
- takeScreenshot: planning/build/onboarding/colours-intro
- scrollUntilVisible:
    element: "Choose a recent selfie"
    direction: DOWN
- tapOn:
    text: "Take a selfie"
    index: 0
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"
- extendedWaitUntil:
    visible: "Take Picture|The camera could not open. Choose a selfie instead."
    timeout: 10000
- runFlow:
    when:
      visible: "Take Picture"
    commands:
      - takeScreenshot: planning/build/onboarding/colours-camera
      - tapOn: "Close"
- runFlow:
    when:
      visible: "The camera could not open. Choose a selfie instead."
    commands:
      - takeScreenshot: planning/build/onboarding/colours-no-camera
- assertVisible: "Choose a recent selfie"
