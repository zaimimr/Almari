appId: com.zaimimran.almari
---
- launchApp:
    clearState: true
- repeat:
    times: 4
    commands:
      - scrollUntilVisible:
          element: "Skip"
          direction: DOWN
      - tapOn: "Skip"
- assertVisible: "Step 5 of 6"
- scrollUntilVisible:
    element: "Take a selfie"
    direction: DOWN
- tapOn: "Take a selfie"
- assertVisible: "Wearing a hijab is fine. Hair is then left out."
- scrollUntilVisible:
    element: "The photo is deleted right after. Only the measured colours are kept."
    direction: DOWN
- takeScreenshot: planning/build/onboarding/colours-intro
- scrollUntilVisible:
    element: "Choose a recent selfie"
    direction: DOWN
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"
- assertNotVisible: "Take photo"
- assertVisible: "Choose a recent selfie"
