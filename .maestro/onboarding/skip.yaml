appId: com.zaimimran.almari
---
- launchApp:
    clearState: true
- repeat:
    times: 5
    commands:
      - scrollUntilVisible:
          element: "Skip"
          direction: DOWN
      - tapOn: "Skip"
- assertVisible: "You are set"
- scrollUntilVisible:
    element: "Start with the sample closet"
    direction: DOWN
- tapOn: "Start with the sample closet"
- assertVisible: "Start with your everyday style."
- takeScreenshot: planning/build/onboarding/skipped-today
