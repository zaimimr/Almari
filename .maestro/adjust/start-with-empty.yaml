appId: com.zaimimran.almari
# UC-F07-05
---
- launchApp:
    permissions:
      all: allow
- extendedWaitUntil:
    visible:
      id: "home-create"
    timeout: 60000
- tapOn:
    id: "home-create"
- extendedWaitUntil:
    visible:
      id: "create-submit"
    timeout: 10000
- tapOn:
    id: "create-more"
- scrollUntilVisible:
    element:
      id: "create-start-with"
    centerElement: true
- tapOn:
    id: "create-start-with"
- assertVisible: "No pieces yet"
- tapOn: "Add pieces"
- extendedWaitUntil:
    visible:
      id: "capture-screen"
    timeout: 20000
