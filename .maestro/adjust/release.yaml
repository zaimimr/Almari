appId: com.zaimimran.almari
# UC-F07-04
---
- runFlow: ../lib/sample-closet.yaml
- scrollUntilVisible:
    element: "Keep.*"
    timeout: 60000
- tapOn: "Keep.*"
- scrollUntilVisible:
    element:
      id: "occasion-chip"
    direction: UP
    timeout: 60000
- tapOn:
    id: "occasion-chip"
- scrollUntilVisible:
    element: "Stop keeping"
    timeout: 60000
- tapOn: "Stop keeping"
- assertVisible: "Start with a piece"
- tapOn: "Show outfit"
- extendedWaitUntil:
    visible:
      id: "today-outfit"
    timeout: 60000
- assertNotVisible: "Keeping.*"
