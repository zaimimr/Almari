appId: com.zaimimran.almari
# UC-F07-05
# seed: seed-owned-everyday.sh
---
- launchApp:
    permissions:
      all: allow
- extendedWaitUntil:
    visible:
      id: "home-create"
    timeout: 60000
- runFlow: ../lib/open-fit.yaml
- runFlow: ../lib/open-adjust.yaml
- tapOn: "Start with a piece"
- tapOn: "Rose tunic"
- tapOn: "Grey trousers"
- assertVisible: "2 selected"
- takeScreenshot: docs/redesign/screens/after/adjust/pieces
- tapOn: "Clear"
- assertNotVisible: "2 selected"
- tapOn: "Rose tunic"
- tapOn: "Grey trousers"
- tapOn: "Start with these"
- assertVisible: "Keeping.*Rose tunic, Grey trousers"
- tapOn: "Show outfit"
- extendedWaitUntil:
    visible:
      id: "today-outfit"
    timeout: 60000
