appId: com.zaimimran.almari
# UC-F07-07
---
- runFlow: ../lib/sample-closet.yaml
- tapOn:
    id: "occasion-chip"
- tapOn: "Work"
- tapOn: "Cancel"
- assertVisible: "Discard.*changes\\?"
- tapOn: "Cancel"
- assertVisible: "Adjust"
- tapOn: "Cancel"
- tapOn: "Discard"
- extendedWaitUntil:
    visible:
      id: "today-outfit"
    timeout: 60000
