appId: com.zaimimran.almari
# UC-F07-08
# seed: fixture.sh now=2026-10-07T09:00:00+02:00
---
- runFlow: ../lib/sample-closet.yaml
- runFlow: ../lib/open-fit.yaml
- runFlow: ../lib/open-adjust.yaml
- assertVisible: "Adjust"
- tapOn: "Eid"
- tapOn: "Choose a date"
- tapOn:
    id: "pick-2026-10-11"
- assertVisible: "Sun 11 Oct"
- takeScreenshot: docs/redesign/screens/after/adjust/adjust
- tapOn: "Show outfit"
- extendedWaitUntil:
    visible:
      id: "today-outfit"
    timeout: 60000
- assertVisible: "Plan this"
- assertNotVisible: "Wear this"
- takeScreenshot: docs/redesign/screens/after/adjust/planning
- tapOn:
    id: "fit-another"
- extendedWaitUntil:
    visible:
      id: "today-outfit"
    timeout: 60000
- tapOn:
    id: "fit-save"
- tapOn: "Plan this"
- extendedWaitUntil:
    visible:
      id: "home-create"
    timeout: 10000
- tapOn: "Looks"
- assertVisible: "Planned for Sun 11 Oct"
