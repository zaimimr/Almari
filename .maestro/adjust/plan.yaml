- assertVisible: "Save look"
- takeScreenshot: docs/redesign/screens/after/adjust/planning
- tapOn: "Another"
- extendedWaitUntil:
    visible:
      id: "today-outfit"
    timeout: 60000
- tapOn: "Save look"
- tapOn: "Back to today"
