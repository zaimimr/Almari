- takeScreenshot: docs/redesign/screens/after/adjust/adjust
- tapOn: "Show outfit"
- extendedWaitUntil:
    visible:
      id: "today-outfit"
    timeout: 60000
- assertVisible: "Sat 11 Oct"
- assertVisible: "Back to today"
