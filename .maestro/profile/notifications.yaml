appId: com.zaimimran.almari
# UC-F11-11
---
- runFlow: ../lib/sample-closet.yaml
- tapOn:
    id: "header-profile"
- assertVisible:
    id: "profile"
- scrollUntilVisible:
    element:
      id: "profile-morning"
- tapOn:
    id: "profile-morning"
- tapOn:
    id: "morning-on-toggle"
- assertVisible:
    id: "morning-on-toggle"
    checked: true
- assertVisible: ".*07:00.*"
- tapOn:
    id: "morning-weekdays-toggle"
- assertVisible:
    id: "morning-weekdays-toggle"
    checked: true
- tapOn:
    text: "Morning outfit"
    index: 0
- assertVisible: ".*07:00.*"
- assertNotVisible:
    id: "morning-time"
- tapOn:
    id: "profile-morning"
- assertVisible:
    id: "morning-weekdays-toggle"
    checked: true
- takeScreenshot: docs/qa/screens/profile-runtime/reminders
- tapOn:
    id: "morning-on-toggle"
- assertNotVisible:
    id: "morning-weekdays"
