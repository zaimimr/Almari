appId: com.zaimimran.almari
# UC-F01-19
---
- runFlow: ../lib/sample-closet.yaml
- launchApp:
    permissions:
      notifications: deny
- extendedWaitUntil:
    visible:
      id: "today-outfit"
    timeout: 60000
- tapOn:
    id: "header-profile"
- scrollUntilVisible:
    element:
      id: "profile-morning"
- tapOn:
    id: "profile-morning"
- tapOn: "07:00.*"
- extendedWaitUntil:
    visible:
      id: "notify-denied"
    timeout: 10000
- assertVisible: "Open Settings"
- tapOn: "Off.*"
- assertNotVisible:
    id: "notify-denied"
