appId: com.zaimimran.almari
# UC-F11-03
---
- runFlow: ../lib/sample-closet.yaml
- tapOn:
    id: "header-profile"
- assertVisible:
    id: "profile"
- scrollUntilVisible:
    element:
      id: "profile-location"
- tapOn:
    id: "profile-location"
- tapOn: "Search for your city"
- inputText: "Oslo"
- pressKey: Enter
- tapOn: "Oslo.*"
- tapOn: "Save"
- scrollUntilVisible:
    element:
      id: "profile-units"
- tapOn:
    id: "profile-units"
- tapOn: "Imperial.*"
- scrollUntilVisible:
    direction: UP
    element:
      id: "tile-colours"
- tapOn:
    id: "tile-colours"
- tapOn: "Bold"
- tapOn: "Save"
- scrollUntilVisible:
    direction: UP
    element:
      id: "profile-name"
- tapOn:
    id: "profile-name"
- inputText: "x"
- tapOn: "Cancel"
- takeScreenshot: docs/redesign/screens/after/profile/answer
