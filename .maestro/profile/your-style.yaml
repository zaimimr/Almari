appId: com.zaimimran.almari
# UC-F11-02
---
- runFlow: ../lib/sample-closet.yaml
- tapOn:
    id: "header-profile"
- assertVisible:
    id: "profile"
- tapOn:
    id: "tile-finish"
- tapOn:
    id: "card-full"
- assertVisible:
    id: "card-full"
    selected: true
- takeScreenshot: docs/redesign/screens/after/profile/style
- tapOn: "Save"
- assertVisible:
    id: "profile"
- assertVisible:
    id: "tile-coverage"
    text: ".*Fully covered.*"
