appId: com.zaimimran.almari
# UC-F01-19
---
- launchApp:
    clearState: true
    permissions:
      all: allow
      notifications: deny
- extendedWaitUntil:
    visible: "What is your name\\?"
    timeout: 20000
- repeat:
    times: 10
    while:
      notVisible: "When should your outfit come?"
    commands:
      - tapOn:
          id: "onboarding-next"
- tapOn: "07:00"
- extendedWaitUntil:
    visible: "Notification access is off"
    timeout: 10000
- assertVisible: "Open Settings"
- assertVisible:
    id: "notify-07:00"
    selected: true
- tapOn: "Off"
- assertNotVisible: "Notification access is off"
