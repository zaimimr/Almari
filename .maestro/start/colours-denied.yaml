appId: com.zaimimran.almari
# UC-F01-08
---
- runFlow: ../lib/sample-closet.yaml
- launchApp:
    permissions:
      camera: deny
- extendedWaitUntil:
    visible:
      id: "home-create"
    timeout: 60000
- tapOn:
    id: "header-profile"
- scrollUntilVisible:
    element:
      id: "tile-colours"
- tapOn:
    id: "tile-colours"
- tapOn: "Scan my face"
- tapOn: "Open camera"
- extendedWaitUntil:
    visible: ".*Camera access is off.*"
    timeout: 10000
- assertVisible: "Open Settings"
- assertVisible: "Choose a recent selfie"
