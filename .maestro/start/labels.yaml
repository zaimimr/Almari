appId: com.zaimimran.almari
# UC-F01-03 labels
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible:
      id: "welcome-start"
    timeout: 20000
- tapOn:
    id: "welcome-start"
- extendedWaitUntil:
    visible: "What is your name\\?"
    timeout: 20000
- assertVisible:
    id: "step-title"
    text: "What is your name?"
- tapOn:
    id: "onboarding-next"
- assertVisible:
    id: "step-title"
    text: "Do you wear a hijab?"
- tapOn:
    id: "onboarding-next"
- assertVisible:
    id: "step-title"
    text: "Which styles do you wear?"
- tapOn:
    id: "onboarding-next"
- assertVisible:
    id: "step-title"
    text: "How covered do you like your everyday outfits?"
- tapOn:
    id: "onboarding-next"
- assertVisible:
    id: "step-title"
    text: "What do you wear most days?"
- tapOn:
    id: "onboarding-next"
- assertVisible:
    id: "step-title"
    text: "For Eid and parties, how much sparkle?"
- tapOn:
    id: "onboarding-next"
- assertVisible:
    id: "step-title"
    text: "Where are you?"
- tapOn: "Back"
- assertVisible: "For Eid and parties, how much sparkle?"
- tapOn:
    id: "sparkle-plain"
- assertVisible:
    id: "sparkle-plain"
    selected: true
- assertVisible:
    id: "sparkle-heavy"
    selected: false
- tapOn: "Back"
- tapOn: "Back"
- tapOn: "Back"
- tapOn:
    id: "card-hijab"
- assertVisible:
    id: "card-hijab"
    text: "checkbox, checked"
