appId: com.zaimimran.almari
# UC-F01-12
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible: "What is your name\\?"
    timeout: 20000
- tapOn:
    id: "name-field"
- inputText: "Sara"
- pressKey: Enter
- assertVisible: "Do you wear a hijab?"
- tapOn: "Back"
- assertVisible: "What is your name?"
- tapOn:
    id: "name-field"
- eraseText: 10
- tapOn: "Next"
- assertVisible: "Do you wear a hijab?"
- repeat:
    times: 10
    while:
      notVisible: "You are set"
    commands:
      - tapOn:
          id: "onboarding-next"
- tapOn: "Try the sample closet"
- extendedWaitUntil:
    visible:
      id: "today-outfit"
    timeout: 60000
- tapOn: "Profile"
- scrollUntilVisible:
    element: "Replay onboarding"
- tapOn: "Replay onboarding"
- assertVisible: "What is your name?"
- assertNotVisible: "Sara"
