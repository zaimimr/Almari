# seed: selfie.sh
appId: com.zaimimran.almari
# seed: ax5.sh
# seed: fixture.sh language=nb
---
- addMedia:
    - "../../assets/fixtures/selfie.jpg"
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible:
      id: "welcome-start"
    timeout: 20000
- tapOn:
    id: "welcome-start"
- extendedWaitUntil:
    visible:
      id: "step-1-of-8"
    timeout: 20000
- tapOn:
    id: "onboarding-next"
- tapOn:
    id: "hijab-always"
- tapOn:
    id: "onboarding-next"
- assertVisible:
    id: "step-3-of-8"
- takeScreenshot: docs/redesign/screens/after/start/ax-hijab-styles
- tapOn:
    id: "onboarding-next"
- assertVisible:
    id: "step-4-of-8"
- takeScreenshot: docs/redesign/screens/after/start/ax-coverage
- repeat:
    while:
      notVisible:
        id: "step-7-of-8"
    commands:
      - tapOn:
          id: "onboarding-next"
- takeScreenshot: docs/redesign/screens/after/start/ax-body
- tapOn:
    id: "onboarding-next"
- assertVisible:
    id: "step-8-of-8"
- takeScreenshot: docs/redesign/screens/after/start/ax-place
- tapOn:
    id: "onboarding-next"
- scrollUntilVisible:
    element:
      id: "done-sample"
- tapOn:
    id: "done-sample"
- extendedWaitUntil:
    visible:
      id: "home-create"
    timeout: 60000
- tapOn:
    id: "header-profile"
- scrollUntilVisible:
    element:
      id: "tile-colours"
    visibilityPercentage: 50
    centerElement: true
- tapOn:
    id: "tile-colours"
- tapOn:
    id: "colours-selfie"
- tapOn:
    id: "colours-open-camera"
- assertVisible:
    id: "face-circle"
- takeScreenshot: docs/redesign/screens/after/start/ax-face
- scrollUntilVisible:
    element:
      id: "colours-library"
- tapOn:
    id: "colours-library"
- extendedWaitUntil:
    visible: "Photo, \\d+ [A-Za-z]+, \\d+:\\d+"
    timeout: 20000
- tapOn: "Photo, \\d+ [A-Za-z]+, \\d+:\\d+"
- runFlow:
    when:
      visible: "Add|Done"
    commands:
      - tapOn: "Add|Done"
- extendedWaitUntil:
    visible:
      id: "colours-choice|colour-result"
    timeout: 60000
- runFlow:
    when:
      visible:
        id: "colours-choice"
    commands:
      - tapOn:
          id: "colours-choose-.*"
          index: 0
- extendedWaitUntil:
    visible:
      id: "colour-result"
    timeout: 10000
- takeScreenshot: docs/redesign/screens/after/start/ax-palette
