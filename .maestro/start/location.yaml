appId: com.zaimimran.almari
# UC-F01-18
# seed: set-location.sh
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible:
      id: "welcome-start"
    timeout: 20000
- tapOn:
    id: "welcome-start"
- extendedWaitUntil:
    visible: "What is your name\\?"
    timeout: 20000
- repeat:
    times: 10
    while:
      notVisible: "Where are you?"
    commands:
      - tapOn:
          id: "onboarding-next"
- tapOn:
    id: "place-locate"
- extendedWaitUntil:
    visible:
      id: "place-check"
    timeout: 20000
- assertVisible: "Oslo"
- tapOn: "Next"
- assertVisible: "You are set"
- repeat:
    times: 10
    while:
      notVisible: "You are set"
    commands:
      - tapOn:
          id: "onboarding-next"
- tapOn: "Try the sample closet"
- extendedWaitUntil:
    visible:
      id: "today-outfit"
    timeout: 60000
- tapOn:
    id: "header-profile"
- scrollUntilVisible:
    element:
      id: "profile-location"
- tapOn:
    id: "profile-location"
- assertVisible:
    id: "place-check"
- assertVisible: "Oslo"
