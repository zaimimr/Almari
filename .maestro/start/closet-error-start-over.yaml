appId: com.zaimimran.almari
# seed: broken-closet.sh
---
- launchApp
- extendedWaitUntil:
    visible: "Could not open your closet"
    timeout: 20000
- tapOn:
    id: "splash-start-over"
- tapOn: "Cancel"
- assertVisible: "Could not open your closet"
- assertNotVisible:
    id: "welcome-start"
- tapOn:
    id: "splash-start-over"
- takeScreenshot: docs/qa/screens/onboarding-runtime/start-over-confirm
- tapOn:
    text: "Start over"
    above:
      id: "splash-start-over"
- extendedWaitUntil:
    visible:
      id: "welcome-start"
    timeout: 20000
- assertNotVisible: "Could not open your closet"
- takeScreenshot: docs/qa/screens/onboarding-runtime/start-over
