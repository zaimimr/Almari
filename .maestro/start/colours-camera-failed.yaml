appId: com.zaimimran.almari
# UC-F01-11
# seed: fixture.sh cameraFails=true
---
- runFlow: ../lib/sample-closet.yaml
- tapOn:
    id: "header-profile"
- scrollUntilVisible:
    element:
      id: "tile-colours"
- tapOn:
    id: "tile-colours"
- tapOn: "Take a selfie"
- tapOn: "Open camera"
- tapOn:
    id: "face-circle"
- extendedWaitUntil:
    visible: ".*Could not open the camera"
    timeout: 10000
- assertVisible: "Try again"
- assertVisible: "Choose a recent selfie"
