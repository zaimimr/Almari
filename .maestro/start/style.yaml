appId: com.zaimimran.almari
# UC-F01-15
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible:
      id: "welcome-start"
    timeout: 20000
- tapOn:
    id: "welcome-start"
- extendedWaitUntil:
    visible: "What is your name\\?"
    timeout: 20000
- repeat:
    times: 10
    while:
      notVisible: "What do you wear most days?"
    commands:
      - tapOn:
          id: "onboarding-next"
- tapOn:
    id: "style-desi"
- assertVisible:
    id: "style-desi"
    selected: true
- takeScreenshot: docs/redesign/screens/after/start/style
- tapOn:
    id: "onboarding-next"
- assertVisible: "For Eid and parties, how much sparkle?"
- repeat:
    times: 10
    while:
      notVisible: "You are set"
    commands:
      - tapOn:
          id: "onboarding-next"
- tapOn: "Try the sample closet"
- extendedWaitUntil:
    visible:
      id: "home-create"
    timeout: 60000
- tapOn:
    id: "header-profile"
- scrollUntilVisible:
    element:
      id: "tile-style"
- tapOn:
    id: "tile-style"
- assertVisible:
    id: "style-desi"
    selected: true
