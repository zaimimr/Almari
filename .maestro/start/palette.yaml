# seed: selfie.sh
appId: com.zaimimran.almari
# UC-F01-21
---
- addMedia:
    - "../../assets/fixtures/selfie.jpg"
- runFlow: ../lib/sample-closet.yaml
- tapOn:
    id: "header-profile"
- scrollUntilVisible:
    element:
      id: "tile-colours"
- tapOn:
    id: "tile-colours"
- tapOn: "Scan my face"
- tapOn: "Open camera"
- tapOn:
    id: "colours-library"
- extendedWaitUntil:
    visible: "Photo, \\d+ [A-Za-z]+, \\d+:\\d+"
    timeout: 20000
- tapOn: "Photo, \\d+ [A-Za-z]+, \\d+:\\d+"
- runFlow:
    when:
      visible: "Add|Done"
    commands:
      - tapOn: "Add|Done"
- extendedWaitUntil:
    visible:
      id: "colours-choice|colour-result"
    timeout: 60000
- runFlow:
    when:
      visible:
        id: "colours-choice"
    commands:
      - tapOn:
          id: "colours-choose-.*"
          index: 0
- extendedWaitUntil:
    visible:
      id: "colour-result"
    timeout: 10000
- assertVisible: "Best hijab shades"
- assertVisible: "Go easy on"
- assertVisible:
    id: "colours-save"
- takeScreenshot: docs/redesign/screens/after/start/palette
- tapOn: "These don't look like me"
- assertVisible:
    id: "colours-hair-toggle"
- assertVisible: "Undertone"
- assertVisible: "Depth"
- assertVisible: "Contrast"
- takeScreenshot: docs/redesign/screens/after/start/palette-notme
- tapOn: "Save colours"
- assertVisible: "Which colours suit you\\?"
- assertVisible:
    id: "colours-saved"
- tapOn: "Back"
- assertVisible:
    id: "profile"
- assertVisible: "(Light|Warm|Clear|Cool|Soft|Deep) (spring|summer|autumn|winter)"
