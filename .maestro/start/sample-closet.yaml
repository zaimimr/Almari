appId: com.zaimimran.almari
# UC-F01-10
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible:
      id: "welcome-start"
    timeout: 20000
- tapOn:
    id: "welcome-start"
- extendedWaitUntil:
    visible: "What is your name\\?"
    timeout: 20000
- repeat:
    times: 10
    while:
      notVisible: "You are set"
    commands:
      - tapOn:
          id: "onboarding-next"
- tapOn: "Try the sample closet"
- extendedWaitUntil:
    visible:
      id: "home-create"
    timeout: 60000
- tapOn: "Closet"
- scrollUntilVisible:
    element:
      id: "tile-sample-mauve-hijab"
    direction: DOWN
    visibilityPercentage: 1
