appId: com.zaimimran.almari
# UC-F01-10
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible: "What is your name\\?"
    timeout: 20000
- repeat:
    times: 10
    while:
      notVisible: "You are set"
    commands:
      - tapOn:
          id: "onboarding-next"
- tapOn: "Try the sample closet"
- extendedWaitUntil:
    visible:
      id: "today-outfit"
    timeout: 60000
- tapOn: "Closet"
- assertVisible: "Sample"
