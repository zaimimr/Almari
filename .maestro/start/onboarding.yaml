appId: com.zaimimran.almari
# UC-F01-03
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible:
      id: "welcome-start"
    timeout: 20000
- tapOn:
    id: "welcome-start"
- extendedWaitUntil:
    visible: "What is your name\\?"
    timeout: 20000
- assertVisible: "What is your name?"
- assertVisible:
    id: "step-1-of-7"
- assertNotVisible:
    id: "onboarding-back"
- takeScreenshot: docs/redesign/screens/after/start/name
- tapOn:
    id: "name-field"
- inputText: "Sara"
- waitForAnimationToEnd
- tapOn:
    id: "onboarding-next"
- assertVisible: "Do you wear a hijab?"
- assertVisible:
    id: "step-2-of-7"
- assertVisible: "Skip"
- tapOn:
    id: "hijab-sometimes"
- takeScreenshot: docs/redesign/screens/after/start/hijab
- tapOn: "Next"
- assertVisible: "Which styles do you wear?"
- tapOn:
    id: "card-hijab"
- tapOn:
    id: "card-shayla"
- tapOn: "Next"
- assertVisible: "How covered do you like your everyday outfits?"
- tapOn:
    id: "card-moderate"
- tapOn: "Next"
- assertVisible: "What do you wear most days?"
- tapOn:
    id: "style-both"
- tapOn: "Back"
- assertVisible: "How covered do you like your everyday outfits?"
- assertVisible:
    id: "card-moderate"
    selected: true
- tapOn: "Next"
- assertVisible: "What do you wear most days?"
- assertVisible:
    id: "style-both"
    selected: true
- tapOn: "Next"
- assertVisible: "For Eid and parties, how much sparkle?"
- tapOn:
    id: "sparkle-little"
- tapOn: "Next"
- assertVisible: "Where are you?"
- assertVisible:
    id: "step-7-of-7"
- tapOn: "Next"
- assertVisible: "You are set"
- assertNotVisible:
    id: "onboarding-next"
- takeScreenshot: docs/redesign/screens/after/start/done
- tapOn: "Try the sample closet"
- extendedWaitUntil:
    visible:
      id: "today-outfit"
    timeout: 60000
- tapOn:
    id: "header-profile"
- assertVisible:
    id: "profile-name"
    text: "Sara"
- tapOn:
    id: "tile-coverage"
- assertVisible:
    id: "card-moderate"
    selected: true
- tapOn: "Back"
- tapOn:
    id: "tile-style"
- assertVisible:
    id: "style-both"
    selected: true
- tapOn: "Back"
- scrollUntilVisible:
    element:
      id: "tile-sparkle"
- tapOn:
    id: "tile-sparkle"
- assertVisible:
    id: "sparkle-little"
    selected: true
