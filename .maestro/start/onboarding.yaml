appId: com.zaimimran.almari
# UC-F01-03
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible: "What is your name\\?"
    timeout: 20000
- assertVisible: "What is your name?"
- assertVisible:
    id: "step-1-of-10"
- assertNotVisible:
    id: "onboarding-back"
- takeScreenshot: docs/redesign/screens/after/start/name
- tapOn:
    id: "name-field"
- inputText: "Sara"
- tapOn: "Next"
- assertVisible: "Do you wear a hijab?"
- assertVisible:
    id: "step-2-of-10"
- assertNotVisible: "Skip"
- tapOn: "Sometimes"
- takeScreenshot: docs/redesign/screens/after/start/hijab
- tapOn: "Next"
- assertVisible: "Which styles do you wear?"
- tapOn:
    id: "card-hijab"
- tapOn:
    id: "card-shayla"
- tapOn: "Next"
- assertVisible: "How covered do you like your everyday outfits?"
- tapOn:
    id: "card-moderate"
- tapOn: "Next"
- assertVisible: "What do you wear most days?"
- tapOn:
    id: "style-both"
- tapOn: "Back"
- assertVisible: "How covered do you like your everyday outfits?"
- assertVisible:
    id: "card-moderate"
    selected: true
- tapOn: "Next"
- assertVisible: "What do you wear most days?"
- assertVisible:
    id: "style-both"
    selected: true
- tapOn: "Next"
- assertVisible: "How do you like your clothes to sit?"
- tapOn:
    id: "card-loose"
- tapOn: "Next"
- assertVisible: "For Eid and parties, how much sparkle?"
- tapOn: "A little"
- tapOn: "Next"
- assertVisible: "Where are you?"
- tapOn: "Next"
- assertVisible: "When should your outfit come?"
- tapOn: "Next"
- assertVisible: "Which colours suit you?"
- assertVisible:
    id: "step-10-of-10"
- takeScreenshot: docs/redesign/screens/after/start/colours
- tapOn: "Next"
- assertVisible: "You are set"
- assertNotVisible:
    id: "onboarding-next"
- takeScreenshot: docs/redesign/screens/after/start/done
- tapOn: "Try the sample closet"
- extendedWaitUntil:
    visible:
      id: "today-outfit"
    timeout: 60000
- tapOn: "Profile"
- scrollUntilVisible:
    element: "Replay onboarding"
- tapOn: "Replay onboarding"
- assertVisible: "What is your name?"
- assertVisible: "Sara"
- tapOn: "Next"
- assertVisible:
    id: "hijab-sometimes"
    selected: true
- tapOn: "Next"
- assertVisible:
    id: "card-hijab"
    text: "checkbox, checked"
- assertVisible:
    id: "card-shayla"
    text: "checkbox, checked"
- tapOn: "Next"
- assertVisible:
    id: "card-moderate"
    selected: true
- tapOn: "Next"
- assertVisible:
    id: "style-both"
    selected: true
- tapOn: "Next"
- assertVisible:
    id: "card-loose"
    selected: true
- tapOn: "Next"
- assertVisible:
    id: "sparkle-little"
    selected: true
