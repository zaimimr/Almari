appId: com.zaimimran.almari
# UC-F01-17
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible:
      id: "welcome-start"
    timeout: 20000
- tapOn:
    id: "welcome-start"
- extendedWaitUntil:
    visible: "What is your name\\?"
    timeout: 20000
- repeat:
    times: 10
    while:
      notVisible: "For Eid and parties, how much sparkle?"
    commands:
      - tapOn:
          id: "onboarding-next"
- tapOn:
    id: "sparkle-heavy"
- assertVisible:
    id: "sparkle-heavy"
    selected: true
- takeScreenshot: docs/redesign/screens/after/start/sparkle
- tapOn: "Next"
- assertVisible: "Your height, weight and shape"
- repeat:
    times: 10
    while:
      notVisible: "You are set"
    commands:
      - tapOn:
          id: "onboarding-next"
- tapOn: "Try the sample closet"
- extendedWaitUntil:
    visible:
      id: "home-create"
    timeout: 60000
- tapOn:
    id: "header-profile"
- scrollUntilVisible:
    element:
      id: "tile-sparkle"
- tapOn:
    id: "tile-sparkle"
- assertVisible:
    id: "sparkle-heavy"
    selected: true
