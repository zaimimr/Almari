appId: com.zaimimran.almari
# UC-F01-17
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible: "What is your name\\?"
    timeout: 20000
- repeat:
    times: 10
    while:
      notVisible: "For Eid and parties, how much sparkle?"
    commands:
      - tapOn:
          id: "onboarding-next"
- tapOn: "Heavy"
- assertVisible:
    id: "sparkle-heavy"
    selected: true
- takeScreenshot: docs/redesign/screens/after/start/sparkle
- tapOn: "Next"
- assertVisible: "Where are you?"
- repeat:
    times: 10
    while:
      notVisible: "You are set"
    commands:
      - tapOn:
          id: "onboarding-next"
- tapOn: "Try the sample closet"
- extendedWaitUntil:
    visible:
      id: "today-outfit"
    timeout: 60000
- tapOn: "Profile"
- scrollUntilVisible:
    element: "Replay onboarding"
- tapOn: "Replay onboarding"
- assertVisible: "What is your name?"
- repeat:
    times: 10
    while:
      notVisible: "For Eid and parties, how much sparkle?"
    commands:
      - tapOn:
          id: "onboarding-next"
- assertVisible:
    id: "sparkle-heavy"
    selected: true
