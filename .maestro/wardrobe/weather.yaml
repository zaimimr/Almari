appId: com.zaimimran.almari
env:
  SHOT: ""
---
- launchApp
- tapOn: "Closet"
- scrollUntilVisible:
    element: "Black boots.*"
    centerElement: true
    timeout: 60000
- tapOn: "Black boots.*"
- scrollUntilVisible:
    element: "Snow \\(suggested\\)"
    timeout: 60000
- scrollUntilVisible:
    element: "Rain \\(suggested\\)"
    timeout: 60000
- scrollUntilVisible:
    element: "Suggested from the fabric and type.*"
    timeout: 60000
- takeScreenshot: planning/build/wardrobe/${SHOT}weather-editor
- scrollUntilVisible:
    element: "Fine in snow"
    centerElement: true
    timeout: 60000
- tapOn: "Fine in snow"
- assertVisible: "Snow"
- assertNotVisible: "Snow \\(suggested\\)"
- scrollUntilVisible:
    element: "Rain \\(suggested\\)"
    direction: UP
    timeout: 60000
- takeScreenshot: planning/build/wardrobe/${SHOT}weather-confirmed
- tapOn: "Back"
- scrollUntilVisible:
    element: "Navy wool coat.*"
    centerElement: true
    timeout: 60000
- tapOn: "Navy wool coat.*"
- scrollUntilVisible:
    element: "Warmth \\(suggested\\)"
    timeout: 60000
- scrollUntilVisible:
    element: "Medium"
    centerElement: true
    timeout: 60000
- tapOn: "Medium"
- assertVisible: "Warmth"
- assertNotVisible: "Warmth \\(suggested\\)"
- assertVisible: "Used when the forecast.*"
- takeScreenshot: planning/build/wardrobe/${SHOT}weather-coat
