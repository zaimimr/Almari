appId: com.zaimimran.almari
env:
  SHOT: ""
---
- launchApp
- scrollUntilVisible:
    element: "My clothes"
    centerElement: true
    timeout: 60000
- tapOn: "My clothes"
- scrollUntilVisible:
    element: "Check before wearing"
    timeout: 60000
- scrollUntilVisible:
    element: "The sleeve length of Rose tunic is not confirmed yet."
    timeout: 60000
- takeScreenshot: planning/build/wardrobe/${SHOT}coverage-review
- scrollUntilVisible:
    element: "Answer one question"
    centerElement: true
    timeout: 60000
- tapOn: "Answer one question"
- assertVisible: "How long are the sleeves on Rose tunic?"
- takeScreenshot: planning/build/wardrobe/${SHOT}coverage-question
- scrollUntilVisible:
    element: "Long"
    centerElement: true
    timeout: 60000
- tapOn: "Long"
- scrollUntilVisible:
    element: "Save answer"
    centerElement: true
    timeout: 60000
- tapOn: "Save answer"
- assertNotVisible: "The sleeve length of Rose tunic is not confirmed yet."
- takeScreenshot: planning/build/wardrobe/${SHOT}coverage-ready
- tapOn: "Closet"
- scrollUntilVisible:
    element: "Rose tunic.*"
    centerElement: true
    timeout: 60000
- tapOn: "Rose tunic.*"
- tapOn: "Edit"
- scrollUntilVisible:
    element: "Fabric"
    centerElement: true
    timeout: 60000
- tapOn: "Fabric: Chiffon"
- scrollUntilVisible:
    element: "Save changes"
    timeout: 60000
- tapOn: "Save changes"
- tapOn: "Back"
- tapOn: "Today"
- scrollUntilVisible:
    element: "Rose tunic may be see-through, so its sleeves are not confirmed."
    timeout: 60000
- scrollUntilVisible:
    element: "Answer one question"
    centerElement: true
    timeout: 60000
- tapOn: "Answer one question"
- assertVisible: "Can you see through Rose tunic?"
- takeScreenshot: planning/build/wardrobe/${SHOT}coverage-see-through
- scrollUntilVisible:
    element: "See-through"
    centerElement: true
    timeout: 60000
- tapOn: "See-through"
- scrollUntilVisible:
    element: "Save answer"
    centerElement: true
    timeout: 60000
- tapOn: "Save answer"
- scrollUntilVisible:
    element: "No combination in this closet meets your sleeve and hem choices."
    direction: UP
    timeout: 60000
- takeScreenshot: planning/build/wardrobe/${SHOT}coverage-r07
- tapOn: "Everyday style"
- scrollUntilVisible:
    element: "Full: arms, legs and neck"
    centerElement: true
    timeout: 60000
- tapOn: "Full: arms, legs and neck"
- assertNotVisible: "Sleeves"
- scrollUntilVisible:
    element: "Sleeves to the wrist and hems to the ankle are checked.*"
    timeout: 60000
- assertVisible: "Sleeves to the wrist and hems to the ankle are checked. Outfits only count sleeves and lengths you have confirmed. Neckline is not checked yet."
- takeScreenshot: planning/build/wardrobe/${SHOT}coverage-full
