appId: com.zaimimran.almari
---
- launchApp:
    clearState: true
- repeat:
    times: 10
    while:
      notVisible: "Da er du klar"
    commands:
      - scrollUntilVisible:
          element: "Hopp over"
          direction: DOWN
          timeout: 60000
      - tapOn: "Hopp over"
- scrollUntilVisible:
    element: "Start med eksempelgarderoben"
    direction: DOWN
    timeout: 60000
- tapOn: "Start med eksempelgarderoben"
- assertVisible: "I dag"
- assertVisible: "Garderobe"
- assertVisible: "Antrekk"
- takeScreenshot: planning/build/wardrobe/nb-today-empty
- tapOn: "Prøv en eksempelstil"
- assertVisible: "Litt inspirasjon for i dag."
- takeScreenshot: planning/build/wardrobe/nb-today
- tapOn: "Juster anledning.*"
- takeScreenshot: planning/build/wardrobe/nb-adjust
- scrollUntilVisible:
    element: "Finn antrekk"
    timeout: 60000
- tapOn: "Avbryt"
- scrollUntilVisible:
    element: "Lagre antrekket"
    centerElement: true
    timeout: 60000
- takeScreenshot: planning/build/wardrobe/nb-today-card
- scrollUntilVisible:
    element: "I dette antrekket"
    timeout: 60000
- takeScreenshot: planning/build/wardrobe/nb-today-pieces
- scrollUntilVisible:
    element: "Stilinnstillinger"
    timeout: 60000
- takeScreenshot: planning/build/wardrobe/nb-today-end
- tapOn: "Garderobe"
- takeScreenshot: planning/build/wardrobe/nb-closet
- tapOn: "Mauve chiffon hijab.*"
- scrollUntilVisible:
    element: "Arkiver plagget"
    timeout: 60000
- takeScreenshot: planning/build/wardrobe/nb-piece
- tapOn: "Tilbake"
- tapOn: "Antrekk"
- takeScreenshot: planning/build/wardrobe/nb-looks
