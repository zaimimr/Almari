appId: com.zaimimran.almari
# UC-F04-02
# seed: seed-closet.sh samples
---
- runFlow: ../lib/open-closet.yaml
- extendedWaitUntil:
    visible:
      id: "closet-grid"
    timeout: 10000
- assertVisible:
    id: "tile-seed-chiffon-hijab"
- assertVisible: "Chiffon hijab, Blush"
- assertNotVisible:
    id: "closet-loading"
- repeat:
    times: 4
    while:
      notVisible:
        id: "category-top"
    commands:
      - swipe:
          start: 85%, 29%
          end: 30%, 29%
- tapOn:
    id: "category-top"
- assertVisible:
    id: "tile-seed-blouse"
- assertNotVisible:
    id: "tile-seed-chiffon-hijab"
- assertVisible:
    id: "chip-more"
- repeat:
    times: 4
    while:
      notVisible:
        id: "category-all"
    commands:
      - swipe:
          start: 30%, 29%
          end: 85%, 29%
- tapOn:
    id: "category-all"
- assertVisible:
    id: "tile-seed-chiffon-hijab"
- scrollUntilVisible:
    element:
      id: "tile-seed-tunic"
    direction: DOWN
- assertVisible: "Rose tunic, Pink, Needs details"
- scrollUntilVisible:
    element:
      id: "tile-sample-mauve-hijab"
    direction: DOWN
    visibilityPercentage: 1
- takeScreenshot: docs/redesign/screens/after/closet/samples
