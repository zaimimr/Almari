appId: com.zaimimran.almari
# UC-F04-10
# seed: seed-closet.sh
---
- runFlow: ../lib/open-closet.yaml
- tapOn:
    id: "header-select"
- tapOn:
    id: "tile-seed-chiffon-hijab"
- tapOn:
    id: "tile-seed-hijab"
- tapOn:
    id: "select-put-away"
- assertVisible:
    id: "select-result"
- assertNotVisible:
    id: "tile-seed-chiffon-hijab"
- tapOn: "Undo"
- assertVisible:
    id: "tile-seed-chiffon-hijab"
- assertVisible: "2 selected"
- tapOn:
    id: "select-put-away"
- assertNotVisible:
    id: "tile-seed-hijab"
- assertVisible:
    id: "header-select"
- runFlow: ../lib/open-filter.yaml
- waitForAnimationToEnd
- swipe:
    from:
      id: "show"
    direction: LEFT
- tapOn:
    id: "show-archived"
- runFlow: ../lib/open-filter.yaml
- assertVisible:
    id: "tile-seed-chiffon-hijab"
- assertVisible:
    id: "tile-seed-hijab"
- assertNotVisible:
    id: "tile-seed-blouse"
- tapOn:
    id: "header-select"
- tapOn:
    id: "tile-seed-chiffon-hijab"
- assertVisible: "Back in the closet"
- tapOn:
    id: "select-put-away"
- assertVisible: "Put back"
- assertNotVisible:
    id: "tile-seed-chiffon-hijab"
- assertVisible:
    id: "tile-seed-hijab"
