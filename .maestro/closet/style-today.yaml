appId: com.zaimimran.almari
# UC-F04-06
# seed: seed-closet.sh
---
- runFlow: ../lib/open-closet.yaml
- tapOn:
    id: "header-select"
- tapOn:
    id: "tile-seed-chiffon-hijab"
- scrollUntilVisible:
    element:
      id: "tile-seed-blouse"
    direction: DOWN
- tapOn:
    id: "tile-seed-blouse"
- assertVisible: "2 selected"
- tapOn:
    id: "select-start"
- extendedWaitUntil:
    notVisible:
      id: "closet-screen"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "outfit-piece-seed-blouse"
    direction: DOWN
    timeout: 60000
- assertVisible:
    id: "outfit-piece-seed-chiffon-hijab"
- tapOn: "Closet"
- assertVisible:
    id: "header-select"
- assertNotVisible: "2 selected"
