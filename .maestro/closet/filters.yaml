appId: com.zaimimran.almari
# UC-F04-04
# seed: seed-closet.sh,seed-wears.sh
---
- runFlow: ../lib/open-closet.yaml
- assertVisible:
    id: "category-all"
- assertNotVisible:
    id: "tile-sample-mauve-hijab"
- takeScreenshot: docs/redesign/screens/after/closet/closet
- repeat:
    times: 4
    while:
      notVisible:
        id: "category-layer"
    commands:
      - swipe:
          start: 85%, 29%
          end: 30%, 29%
- tapOn:
    id: "category-layer"
- assertVisible:
    id: "tile-seed-blazer"
- assertVisible: "Navy blazer.*"
- assertNotVisible:
    id: "tile-seed-tunic"
- repeat:
    times: 4
    while:
      notVisible:
        id: "category-all"
    commands:
      - swipe:
          start: 30%, 29%
          end: 85%, 29%
- tapOn:
    id: "category-all"
- runFlow: ../lib/open-filter.yaml
- assertVisible:
    id: "closet-panel"
- assertVisible: "Not worn lately"
- assertNotVisible:
    id: "closet-clear"
- takeScreenshot: docs/redesign/screens/after/closet/more
- tapOn:
    id: "show-not-worn-lately"
- assertVisible:
    id: "closet-clear"
- runFlow: ../lib/open-filter.yaml
- assertVisible: "Olive maxi dress.*"
- assertNotVisible: "Rose tunic.*"
- assertNotVisible: "Taupe abaya.*"
- runFlow: ../lib/open-filter.yaml
- tapOn:
    id: "show-not-worn-lately"
- tapOn:
    id: "colour-blush"
- runFlow: ../lib/open-filter.yaml
- assertVisible: "Chiffon hijab.*"
- assertNotVisible: "Sand hijab.*"
- runFlow: ../lib/open-filter.yaml
- tapOn:
    id: "colour-blush"
- tapOn:
    id: "season-winter"
- tapOn:
    id: "closet-clear"
- assertNotVisible:
    id: "closet-clear"
- runFlow: ../lib/open-filter.yaml
- assertVisible: "Chiffon hijab.*"
- runFlow: ../lib/open-filter.yaml
- waitForAnimationToEnd
- swipe:
    from:
      id: "show"
    direction: LEFT
- tapOn:
    id: "show-archived"
- assertVisible: "No pieces found"
- assertVisible:
    id: "closet-clear"
- runFlow: ../lib/open-filter.yaml
- assertVisible: "No pieces found"
- tapOn: "Clear filters"
- assertVisible: "Chiffon hijab.*"
