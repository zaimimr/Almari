appId: com.zaimimran.almari
---
- addMedia:
    - "sage-kurta.png"
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible: "Skip"
    timeout: 60000
- takeScreenshot: docs/redesign/screens/before/onboarding-index
- repeat:
    times: 6
    while:
      notVisible: "Take a selfie"
    commands:
      - scrollUntilVisible:
          element: "Skip"
          direction: DOWN
          timeout: 60000
      - tapOn: "Skip"
- tapOn: "Take a selfie"
- waitForAnimationToEnd
- takeScreenshot: docs/redesign/screens/before/onboarding-colours
- tapOn: "Back"
- waitForAnimationToEnd
- repeat:
    times: 10
    while:
      notVisible: "You are set"
    commands:
      - scrollUntilVisible:
          element: "Skip"
          direction: DOWN
          timeout: 60000
      - tapOn: "Skip"
- scrollUntilVisible:
    element: "Start with the sample closet"
    direction: DOWN
    timeout: 60000
- tapOn: "Start with the sample closet"
- scrollUntilVisible:
    element: "Try a sample style"
    centerElement: true
    timeout: 60000
- takeScreenshot: docs/redesign/screens/before/today-empty
- tapOn: "Everyday style"
- waitForAnimationToEnd
- takeScreenshot: docs/redesign/screens/before/today-everyday
- tapOn: "Back"
- waitForAnimationToEnd
- tapOn: "Try a sample style"
- scrollUntilVisible:
    element: "A little inspiration for today."
    direction: UP
    timeout: 60000
- takeScreenshot: docs/redesign/screens/before/tab-today
- tapOn: "Adjust.*"
- waitForAnimationToEnd
- takeScreenshot: docs/redesign/screens/before/today-adjust
- tapOn: "Back"
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Compare hijabs"
    centerElement: true
    timeout: 60000
- swipe:
    start: 50%, 40%
    end: 50%, 60%
    duration: 1500
- waitForAnimationToEnd
- tapOn: "Compare hijabs"
- extendedWaitUntil:
    visible: "In the outfit now"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: docs/redesign/screens/before/today-hijab
- tapOn: "Back"
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Change .*(tunic|trousers|kurta|blazer|abaya|loafers|bag|shalwar|dress)"
    centerElement: true
    timeout: 60000
- swipe:
    start: 50%, 40%
    end: 50%, 60%
    duration: 1500
- waitForAnimationToEnd
- tapOn: "Change .*(tunic|trousers|kurta|blazer|abaya|loafers|bag|shalwar|dress)"
- waitForAnimationToEnd
- takeScreenshot: docs/redesign/screens/before/today-replace
- tapOn: "Back"
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Choose pieces.*"
    centerElement: true
    timeout: 60000
- swipe:
    start: 50%, 40%
    end: 50%, 60%
    duration: 1500
- waitForAnimationToEnd
- tapOn: "Choose pieces.*"
- waitForAnimationToEnd
- takeScreenshot: docs/redesign/screens/before/today-pieces
- tapOn: "Back"
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Style settings"
    centerElement: true
    timeout: 60000
- swipe:
    start: 50%, 40%
    end: 50%, 60%
    duration: 1500
- waitForAnimationToEnd
- tapOn: "Style settings"
- waitForAnimationToEnd
- takeScreenshot: docs/redesign/screens/before/today-style
- scrollUntilVisible:
    element: "Compare results"
    centerElement: true
    timeout: 60000
- swipe:
    start: 50%, 40%
    end: 50%, 60%
    duration: 1500
- waitForAnimationToEnd
- tapOn: "Compare results"
- waitForAnimationToEnd
- takeScreenshot: docs/redesign/screens/before/today-stylist-results
- tapOn: "Back"
- waitForAnimationToEnd
- tapOn: "Back"
- waitForAnimationToEnd
- openLink: almari://today/check?id=sample-ivory-tunic&ask=sleeve
- tapOn:
    text: "Open"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: docs/redesign/screens/before/today-check
- tapOn: "Go back"
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Save look"
    direction: UP
    centerElement: true
    timeout: 60000
- swipe:
    start: 50%, 60%
    end: 50%, 40%
    duration: 1500
- waitForAnimationToEnd
- tapOn: "Save look"
- waitForAnimationToEnd
- tapOn:
    text: "Save look"
    below: "Look name"
- waitForAnimationToEnd
- tapOn: "Looks"
- waitForAnimationToEnd
- takeScreenshot: docs/redesign/screens/before/tab-looks
- tapOn: "Open .*"
- waitForAnimationToEnd
- takeScreenshot: docs/redesign/screens/before/look-detail
- tapOn: "Back"
- waitForAnimationToEnd
- tapOn: "Build a look"
- waitForAnimationToEnd
- takeScreenshot: docs/redesign/screens/before/look-build
- tapOn: "Back"
- waitForAnimationToEnd
- tapOn: "Today"
- waitForAnimationToEnd
- tapOn: "Profile"
- waitForAnimationToEnd
- takeScreenshot: docs/redesign/screens/before/tab-profile
- tapOn: "Back"
- waitForAnimationToEnd
- tapOn: "Closet"
- waitForAnimationToEnd
- takeScreenshot: docs/redesign/screens/before/tab-closet
- tapOn: "Add pieces"
- tapOn:
    text: "Skip"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: docs/redesign/screens/before/capture-index
- tapOn: "Scan pieces"
- waitForAnimationToEnd
- takeScreenshot: docs/redesign/screens/before/capture-scan
- tapOn: "Close"
- waitForAnimationToEnd
- tapOn: "Add without photo preparation"
- waitForAnimationToEnd
- takeScreenshot: docs/redesign/screens/before/piece-new
- tapOn: "Cancel"
- waitForAnimationToEnd
- tapOn: "Choose photos"
- tapOn: "Photo, \\d+ [A-Za-z]+, \\d+:\\d+"
- tapOn: "Add|Done"
- extendedWaitUntil:
    visible: ".*, (Quick check|Ready)"
    timeout: 120000
- takeScreenshot: docs/redesign/screens/before/capture-index-prepared
- tapOn: ".*, (Quick check|Ready)"
- waitForAnimationToEnd
- takeScreenshot: docs/redesign/screens/before/capture-detail
- tapOn: "Adjust cut-out"
- extendedWaitUntil:
    visible: "Done"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: docs/redesign/screens/before/cutout
- tapOn: "Cancel"
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Looks right"
    direction: DOWN
    timeout: 60000
- tapOn: "Looks right"
- extendedWaitUntil:
    visible: "Add the care label?"
    timeout: 15000
- tapOn: "Add care label"
- waitForAnimationToEnd
- takeScreenshot: docs/redesign/screens/before/label
- tapOn: "Back"
- waitForAnimationToEnd
- tapOn:
    text: "Skip"
    optional: true
- tapOn: "Add .* ready .*"
- tapOn:
    text: "Close"
    optional: true
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Sage kurta.*"
    centerElement: true
    timeout: 60000
- tapOn: "Sage kurta.*"
- waitForAnimationToEnd
- takeScreenshot: docs/redesign/screens/before/piece-detail
- tapOn: "Edit"
- waitForAnimationToEnd
- takeScreenshot: docs/redesign/screens/before/piece-edit
- tapOn: "Back"
- waitForAnimationToEnd
- tapOn: "Back"
- waitForAnimationToEnd
- openLink: almari://capture/group/baseline-missing
- tapOn:
    text: "Open"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: docs/redesign/screens/before/capture-group
