# seed: seed-piece.sh
appId: com.zaimimran.almari
# UC-F05-18
---
- launchApp
- extendedWaitUntil:
    visible: "Closet"
    timeout: 60000
- openLink: "almari://piece/seed-open-dress"
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible:
      id: "piece-detail"
    timeout: 20000
- assertVisible: ".*Needs details.*"
- tapOn:
    id: "fact-coverage"
- tapOn:
    id: "fact-coverage-sleeve-long"
- tapOn:
    id: "fact-coverage-length-ankle"
- assertVisible: ".*Fully covered.*"
- takeScreenshot: docs/redesign/screens/after/piece/needs-details
- openLink: "almari://piece/seed-long-blouse"
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible:
      id: "piece-detail"
    timeout: 20000
- tapOn:
    id: "fact-coverage"
- assertVisible:
    id: "fact-coverage-sleeve"
- assertNotVisible:
    id: "fact-coverage-length"
- assertNotVisible:
    id: "fact-coverage-sheer"
- openLink: "almari://piece/seed-hijab"
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible:
      id: "piece-detail"
    timeout: 20000
- assertNotVisible:
    id: "fact-coverage"
