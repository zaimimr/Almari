# seed: fixture.sh studio=ok,seed-piece.sh
appId: com.zaimimran.almari
# UC-F05-09
---
- launchApp
- extendedWaitUntil:
    visible: "Closet"
    timeout: 60000
- openLink: "almari://piece/seed-tunic"
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible:
      id: "piece-detail"
    timeout: 20000
- tapOn:
    id: "piece-edit"
- extendedWaitUntil:
    visible:
      id: "piece-edit-screen"
    timeout: 10000
- scrollUntilVisible:
    element:
      text: "Studio sends this photo to Cloudflare\\."
    direction: DOWN
- tapOn:
    id: "photo-ai-again"
- extendedWaitUntil:
    notVisible:
      id: "moment-generating"
    timeout: 60000
- assertVisible:
    text: "Studio"
    selected: true
- tapOn:
    id: "photo-compare"
- assertVisible:
    id: "photo-comparison"
- tapOn:
    id: "photo-compare"
- tapOn: "Save changes"
- extendedWaitUntil:
    visible:
      id: "piece-detail"
    timeout: 10000
- tapOn:
    id: "piece-edit"
- assertVisible:
    text: "Studio"
    selected: true
- tapOn:
    id: "photo-ai-again"
- extendedWaitUntil:
    visible: "Create another"
    timeout: 30000
- tapOn: "Save changes"
- extendedWaitUntil:
    visible:
      id: "piece-detail"
    timeout: 10000
