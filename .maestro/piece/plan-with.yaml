# seed: seed-piece.sh
appId: com.zaimimran.almari
# UC-F05-16
---
- launchApp
- extendedWaitUntil:
    visible: "Closet"
    timeout: 60000
- openLink: "almari://piece/seed-tunic"
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible:
      id: "piece-detail"
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "piece-plan-with"
    direction: DOWN
- tapOn:
    id: "piece-plan-with"
- extendedWaitUntil:
    visible: "Adjust"
    timeout: 20000
# after L10: assert the kept piece chip and the When section focused
