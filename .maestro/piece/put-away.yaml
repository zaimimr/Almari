# seed: seed-piece.sh
appId: com.zaimimran.almari
# UC-F05-05
---
- launchApp
- extendedWaitUntil:
    visible: "Closet"
    timeout: 60000
- openLink: "almari://piece/seed-tunic"
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible:
      id: "piece-detail"
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "piece-put-away"
    direction: DOWN
- tapOn:
    id: "piece-put-away"
- assertVisible:
    id: "piece-put-away-result"
- tapOn:
    id: "piece-undo"
- assertVisible:
    id: "piece-start-with"
- tapOn:
    id: "piece-put-away"
- assertVisible:
    id: "piece-back-in-closet"
- tapOn:
    id: "piece-back-in-closet"
- assertVisible:
    id: "piece-start-with"
