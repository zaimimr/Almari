# seed: seed-piece.sh
appId: com.zaimimran.almari
# UC-F05-17
---
- launchApp
- extendedWaitUntil:
    visible: "Closet"
    timeout: 60000
- openLink: "almari://piece/seed-tunic"
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible:
      id: "piece-detail"
    timeout: 20000
- tapOn:
    id: "fact-sparkle"
- tapOn:
    id: "fact-sparkle-sparkle-bridal"
- assertVisible: ".*Bridal.*"
- openLink: "almari://piece/seed-blazer"
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible:
      id: "piece-detail"
    timeout: 20000
- tapOn:
    id: "fact-warmth"
- tapOn:
    id: "fact-warmth-warmth-warm"
- assertVisible:
    id: "fact-season"
- assertVisible: ".*Winter.*"
