appId: com.zaimimran.almari
# UC-F06-07
# seed: seed-owned-everyday.sh,seed-coverage.sh,seed-unknown-sleeve.sh
---
- launchApp:
    permissions:
      all: allow
- extendedWaitUntil:
    visible:
      id: "today-outfit"
    timeout: 60000
- scrollUntilVisible:
    element:
      id: "today-check"
    direction: DOWN
- assertNotVisible: "Save answer"
- tapOn: "Check .*"
- assertVisible: "Save answer"
- tapOn: "Check .*"
- assertNotVisible: "Save answer"
- tapOn: "Check .*"
- assertVisible: "Save answer"
- copyTextFrom: "Check .*"
- evalScript: ${output.check = maestro.copiedText}
- assertVisible: ${output.check}
- tapOn: "Long"
- tapOn: "Save answer"
- extendedWaitUntil:
    notVisible: ${output.check}
    timeout: 10000
