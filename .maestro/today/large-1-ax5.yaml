appId: com.zaimimran.almari
# Task 41: AX5
# seed: seed-owned-everyday.sh,seed-no-wears.sh,ax5.sh
---
- launchApp:
    permissions:
      all: allow
- extendedWaitUntil:
    visible:
      id: "home-create"
    timeout: 60000
- runFlow: ../lib/open-fit.yaml
- takeScreenshot: docs/redesign/screens/after/today/today-ax5
- tapOn:
    id: "outfit-piece-seed-.*hijab"
- extendedWaitUntil:
    visible: "Change hijab.*"
    timeout: 10000
- takeScreenshot: docs/redesign/screens/after/change-piece/change-ax5
- tapOn:
    id: "change-strip-header"
- scrollUntilVisible:
    element:
      id: "fit-edit"
    direction: DOWN
- waitForAnimationToEnd
- swipe:
    start: 50%, 35%
    end: 50%, 58%
    duration: 3000
- waitForAnimationToEnd
- tapOn:
    id: "fit-another"
- scrollUntilVisible:
    element:
      id: "fit-another"
    direction: DOWN
    timeout: 60000
- takeScreenshot: docs/redesign/screens/after/today/another-ax5
- takeScreenshot: docs/redesign/screens/after/today/today-scrolled-ax5
- tapOn: "Wear this"
- extendedWaitUntil:
    visible: "Worn"
    timeout: 10000
