appId: com.zaimimran.almari
# UC-F06-21
# seed: seed-owned-everyday.sh
---
- launchApp:
    permissions:
      all: allow
- extendedWaitUntil:
    visible:
      id: "today-outfit"
    timeout: 60000
- assertNotVisible: "Rediscover"
- tapOn: "Wear this"
- extendedWaitUntil:
    visible: "Worn today"
    timeout: 10000
- scrollUntilVisible:
    element: "Rediscover"
    direction: DOWN
- scrollUntilVisible:
    element:
      id: "rediscover-.*"
    direction: DOWN
- takeScreenshot: docs/redesign/screens/after/today/rediscover
- tapOn:
    id: "rediscover-.*"
- scrollUntilVisible:
    element: "Started with .*"
    direction: UP
    timeout: 60000
