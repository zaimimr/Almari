appId: com.zaimimran.almari
# UC-F06-08
# seed: seed-owned-everyday.sh,seed-looks.sh,seed-look-everyday.sh
---
- launchApp:
    permissions:
      all: allow
- extendedWaitUntil:
    visible:
      id: "home-create"
    timeout: 60000
- tapOn: "Looks"
- tapOn:
    id: "look-.*"
- tapOn: "Show on Today"
- extendedWaitUntil:
    visible:
      id: "today-outfit"
    timeout: 60000
- assertVisible: "Wear this"
