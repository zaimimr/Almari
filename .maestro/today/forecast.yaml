appId: com.zaimimran.almari
# UC-F06-10
# seed: seed-owned-everyday.sh,seed-place.sh,fixture.sh now=2026-10-05T08:00:00+02:00,fixture-forecast.sh 2026-10-05
---
- launchApp:
    permissions:
      all: allow
- extendedWaitUntil:
    visible:
      id: "today-weather"
      text: "Oslo 4 to 9°.*"
    timeout: 60000
- assertNotVisible:
    id: "forecast-mark"
- tapOn:
    id: "header-profile"
- scrollUntilVisible:
    element:
      id: "forecast-mark"
    direction: DOWN
