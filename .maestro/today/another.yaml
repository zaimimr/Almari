appId: com.zaimimran.almari
# UC-F06-03
---
- runFlow: ../lib/sample-closet.yaml
- runFlow: ../lib/open-fit.yaml
- copyTextFrom:
    id: "fit-name"
- evalScript: ${output.first = maestro.copiedText}
- scrollUntilVisible:
    element:
      id: "fit-another"
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: "fit-another"
- extendedWaitUntil:
    visible:
      id: "today-outfit"
    timeout: 60000
- assertNotVisible:
    id: "fit-name"
    text: ${output.first}
- takeScreenshot: docs/redesign/screens/after/today/another
