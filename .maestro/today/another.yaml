appId: com.zaimimran.almari
# UC-F06-03
---
- runFlow: ../lib/sample-closet.yaml
- copyTextFrom:
    id: "today-title"
- evalScript: ${output.first = maestro.copiedText}
- scrollUntilVisible:
    element:
      id: "today-another"
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- tapOn: "Another"
- extendedWaitUntil:
    visible:
      id: "today-outfit"
    timeout: 60000
- assertNotVisible:
    id: "today-undo"
- assertNotVisible:
    id: "today-not-for-me"
- assertVisible:
    id: "today-adjust"
- takeScreenshot: docs/redesign/screens/after/today/another
