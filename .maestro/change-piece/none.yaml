appId: com.zaimimran.almari
# UC-F08-03
# seed: seed-owned-everyday.sh,seed-one-hijab.sh
---
- launchApp:
    permissions:
      all: allow
- extendedWaitUntil:
    visible:
      id: "home-create"
    timeout: 60000
- runFlow: ../lib/open-fit.yaml
- tapOn:
    id: "outfit-piece-seed-hijab"
- extendedWaitUntil:
    visible: "Change hijab.*"
    timeout: 10000
- scrollUntilVisible:
    element: "No other hijab works with this outfit"
    direction: DOWN
    centerElement: true
- assertVisible: "No other hijab works with this outfit"
- assertNotVisible: "Show all.*"
