appId: com.zaimimran.almari
# UC-F08-06
# seed: seed-owned-everyday.sh
---
- launchApp:
    permissions:
      all: allow
- extendedWaitUntil:
    visible:
      id: "today-outfit"
    timeout: 60000
- tapOn:
    id: "outfit-piece-seed-.*hijab"
- extendedWaitUntil:
    visible: "Change hijab.*"
    timeout: 10000
- longPressOn:
    id: "strip-piece-.*"
    index: 0
- scrollUntilVisible:
    element: "Edit colour"
    direction: DOWN
    centerElement: true
- tapOn: "Edit colour"
- scrollUntilVisible:
    element: "Blush"
    direction: DOWN
    centerElement: true
- tapOn: "Blush"
- assertVisible:
    text: "Blush"
    selected: true
