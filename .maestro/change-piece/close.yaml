appId: com.zaimimran.almari
# UC-F08-05
---
- runFlow: ../lib/sample-closet.yaml
- runFlow: ../lib/open-fit.yaml
- tapOn:
    id: "outfit-piece-sample-.*-hijab"
- extendedWaitUntil:
    visible: "Change hijab.*"
    timeout: 10000
- tapOn:
    id: "strip-piece-.*"
    index: 1
- scrollUntilVisible:
    element:
      id: "fit-another"
    direction: DOWN
    centerElement: true
    timeout: 60000
- copyTextFrom:
    id: "fit-name"
- evalScript: ${output.picked = maestro.copiedText}
- scrollUntilVisible:
    element:
      id: "change-strip-header"
    direction: UP
    centerElement: true
- tapOn:
    id: "change-strip-header"
- assertNotVisible: "Change hijab.*"
- scrollUntilVisible:
    element:
      id: "fit-another"
    direction: DOWN
    centerElement: true
- assertVisible:
    id: "fit-name"
    text: ${output.picked}
