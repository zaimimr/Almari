appId: com.zaimimran.almari
---
- runFlow: ../stylist/start.yaml
- assertNotVisible: "Profile and settings"
- scrollUntilVisible:
    element: "Wear this"
- tapOn: "Wear this"
- assertVisible: "Marked as worn today."
- tapOn: "Profile"
- assertVisible: "Profile and settings"
- assertVisible: "Your answers"
- takeScreenshot: planning/build/profile-onboarding-builder/04-profile${SUFFIX}
- scrollUntilVisible:
    element: "Closet stats"
    direction: DOWN
- scrollUntilVisible:
    element: "Most worn"
    direction: DOWN
- assertVisible: ".*, once"
- takeScreenshot: planning/build/profile-onboarding-builder/05-stats${SUFFIX}
- scrollUntilVisible:
    element: "Open style settings"
    direction: UP
- tapOn: "Open style settings"
- assertVisible: "People and families see these differently.*"
- assertNotVisible: "Edit your answers"
- tapOn: "Cancel"
- assertVisible: "Profile and settings"
- tapOn: "Today"
- assertNotVisible: "Profile and settings"
