appId: com.zaimimran.almari
---
- runFlow: start.yaml
- scrollUntilVisible:
    element: "Wear this"
- tapOn: "Wear this"
- assertVisible: "Marked as worn today."
- tapOn: "Looks"
- assertVisible: "Open Ivory work tunic"
- takeScreenshot: planning/build/stylist/looks
- tapOn: "Open Ivory work tunic"
- assertVisible: "Save this look"
- tapOn: "Cancel"
- tapOn: "Closet"
- scrollUntilVisible:
    element: "Sage embroidered kurta.*"
- tapOn: "Sage embroidered kurta.*"
- scrollUntilVisible:
    element: "Style this piece"
- tapOn: "Style this piece"
- scrollUntilVisible:
    element: "Styled for work."
    direction: UP
- assertVisible: "Just for now. Your everyday style is unchanged."
- assertVisible: "Kept"
- takeScreenshot: planning/build/stylist/style-this-piece
