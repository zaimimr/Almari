appId: com.zaimimran.almari
---
- runFlow: start.yaml
- assertVisible:
    id: "today-outfit"
- takeScreenshot: planning/build/stylist/large-text-today
- scrollUntilVisible:
    element: "Not for me"
    timeout: 60000
- tapOn: "Not for me"
- takeScreenshot: planning/build/stylist/large-text-chips
- scrollUntilVisible:
    element: "Style settings"
    timeout: 60000
- tapOn: "Style settings"
- takeScreenshot: planning/build/stylist/large-text-settings
- scrollUntilVisible:
    element: "Save style settings"
    timeout: 60000
- takeScreenshot: planning/build/stylist/large-text-settings-end
