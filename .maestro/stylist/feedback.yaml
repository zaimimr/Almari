appId: com.zaimimran.almari
---
- runFlow: start.yaml
- scrollUntilVisible:
    element: "Ivory work tunic"
- scrollUntilVisible:
    element: "Every piece is marked for work.*"
- scrollUntilVisible:
    element: "Wear this"
- tapOn: "Wear this"
- assertVisible: "Marked as worn today."
- takeScreenshot: planning/build/stylist/worn
- tapOn: "Undo"
- assertVisible: "Wear this"
- tapOn: "Not for me"
- scrollUntilVisible:
    element: "Too formal.*"
- assertVisible: "What is not right?"
- tapOn: "Too formal.*"
- scrollUntilVisible:
    element: "Thanks. This outfit takes that into account.*"
- scrollUntilVisible:
    element: "Undo last change"
- takeScreenshot: planning/build/stylist/too-formal
- scrollUntilVisible:
    element: "Not for me"
    direction: UP
- tapOn:
    text: "Change"
    index: 0
- assertNotVisible: "Thanks. This outfit takes that into account.*"
- scrollUntilVisible:
    element: "Not for me"
- tapOn: "Not for me"
- scrollUntilVisible:
    element: "Not my style.*"
- tapOn: "Not my style.*"
- scrollUntilVisible:
    element: "Thanks. This outfit takes that into account.*"
- scrollUntilVisible:
    element: "Undo last change"
- tapOn: "Undo last change"
- assertNotVisible: "Thanks. This outfit takes that into account.*"
