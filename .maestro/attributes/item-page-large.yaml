appId: com.zaimimran.almari
---
- launchApp
- tapOn: "Closet"
- scrollUntilVisible:
    element:
      text: "Seed kurta.*"
    direction: DOWN
    visibilityPercentage: 50
    centerElement: true
- tapOn: "Seed kurta.*"
- takeScreenshot: planning/build/attributes/item-page-large-text
- scrollUntilVisible:
    element:
      id: "fact-sleeve"
    direction: DOWN
- tapOn:
    id: "fact-sleeve"
- scrollUntilVisible:
    element:
      text: "Not now"
    direction: DOWN
- takeScreenshot: planning/build/attributes/item-page-large-text-question
- tapOn: "Not now"
- scrollUntilVisible:
    element:
      id: "piece-availability"
    direction: DOWN
    visibilityPercentage: 30
- takeScreenshot: planning/build/attributes/item-page-large-text-end
