appId: com.zaimimran.almari
---
- launchApp
- tapOn: "Closet"
- tapOn: "Add pieces"
- tapOn: "Sage kurta, Quick check"
- scrollUntilVisible:
    element:
      text: "Where does it end?"
    direction: DOWN
- assertVisible: "Suggested: Knee"
- takeScreenshot: planning/build/attributes/quick-check
- tapOn: "Calf"
- scrollUntilVisible:
    element:
      text: "Looks right"
    direction: DOWN
- tapOn: "Looks right"
- tapOn: "Skip"
- assertVisible: "Sage kurta, Ready"
