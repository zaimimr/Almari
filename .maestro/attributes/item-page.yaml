appId: com.zaimimran.almari
---
- launchApp
- tapOn: "Closet"
- tapOn: "Seed kurta.*"
- assertVisible: "Length: Ankle"
- assertVisible: "Not in any saved looks yet"
- takeScreenshot: planning/build/attributes/item-page
- tapOn:
    id: "fact-fabric"
- assertVisible:
    id: "fact-question"
- scrollUntilVisible:
    element:
      text: "Fabric: Looks right"
    direction: DOWN
- takeScreenshot: planning/build/attributes/item-page-question
- tapOn: "Fabric: Looks right"
- assertNotVisible:
    id: "fact-question"
- tapOn:
    id: "fact-fabric"
- assertNotVisible:
    id: "fact-question"
- scrollUntilVisible:
    element:
      text: "In the wash"
    direction: DOWN
- tapOn: "In the wash"
- assertVisible: "Mark as available"
- takeScreenshot: planning/build/attributes/item-page-away
- tapOn: "Edit"
- tapOn:
    id: "piece-name"
- inputText: " edit"
- scrollUntilVisible:
    element:
      text: "Save changes"
    direction: DOWN
- tapOn: "Save changes"
- assertVisible: "Seed kurta edit"
- scrollUntilVisible:
    element:
      text: "Mark as available"
    direction: DOWN
- launchApp
- tapOn: "Closet"
- repeat:
    times: 3
    commands:
      - swipe:
          from: "Filters"
          direction: LEFT
- tapOn: "Unavailable"
- assertVisible: "Seed kurta edit.*"
- tapOn: "Seed kurta edit.*"
- scrollUntilVisible:
    element:
      text: "Mark as available"
    direction: DOWN
- tapOn: "Mark as available"
- assertNotVisible: "Mark as available"
