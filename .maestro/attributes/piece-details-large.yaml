appId: com.zaimimran.almari
---
- launchApp
- tapOn: "Closet"
- scrollUntilVisible:
    element:
      text: "Seed kurta.*"
    direction: DOWN
    visibilityPercentage: 50
    centerElement: true
- tapOn: "Seed kurta.*"
- tapOn: "Edit"
- scrollUntilVisible:
    element:
      id: "attribute-sleeve-source"
    direction: DOWN
    speed: 20
    timeout: 60000
- takeScreenshot: planning/build/attributes/piece-details-large-text
- scrollUntilVisible:
    element:
      text: "Save changes"
    direction: DOWN
    speed: 20
    timeout: 60000
- takeScreenshot: planning/build/attributes/piece-details-large-text-end
