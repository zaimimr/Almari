appId: com.zaimimran.almari
---
- launchApp
- tapOn: "Closet"
- tapOn: "Seed kurta.*"
- tapOn: "Edit"
- scrollUntilVisible:
    element:
      id: "attribute-length"
    direction: DOWN
- assertVisible:
    text: "Confirmed"
    id: "attribute-length-source"
- scrollUntilVisible:
    element:
      id: "attribute-sleeve"
    direction: DOWN
- assertVisible:
    text: "Suggested from the photo"
    id: "attribute-sleeve-source"
- takeScreenshot: planning/build/attributes/piece-details
- tapOn: "Sleeves: Looks right"
- assertVisible:
    text: "Confirmed"
    id: "attribute-sleeve-source"
- scrollUntilVisible:
    element:
      id: "attribute-fabric"
    direction: DOWN
- tapOn: "Fabric: Silk"
- assertVisible:
    text: "Confirmed"
    id: "attribute-fabric-source"
- takeScreenshot: planning/build/attributes/piece-details-confirmed
- scrollUntilVisible:
    element:
      text: "Save changes"
    direction: DOWN
- tapOn: "Save changes"
- assertVisible: "Fabric: Silk"
- tapOn: "Edit"
- scrollUntilVisible:
    element:
      id: "attribute-fabric"
    direction: DOWN
- assertVisible:
    text: "Confirmed"
    id: "attribute-fabric-source"
- scrollUntilVisible:
    element:
      id: "attribute-sleeve"
    direction: UP
- assertVisible:
    text: "Confirmed"
    id: "attribute-sleeve-source"
