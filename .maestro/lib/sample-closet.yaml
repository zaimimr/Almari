appId: com.zaimimran.almari
---
- runFlow: skip-onboarding.yaml
- scrollUntilVisible:
    element: "Start with the sample closet"
    direction: DOWN
    timeout: 60000
- tapOn: "Start with the sample closet"
- runFlow:
    when:
      visible: "Try a sample style"
    commands:
      - tapOn: "Try a sample style"
- extendedWaitUntil:
    visible:
      id: "today-outfit"
    timeout: 60000
