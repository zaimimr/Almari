appId: com.zaimimran.almari
# UC-F02-15
---
- addMedia:
    - "../../assets/wardrobe/ivory-hijab.png"
- runFlow: ../lib/open-add.yaml
- tapOn:
    text: "Got it"
    optional: true
- runFlow:
    file: ../lib/pick-photos.yaml
    env:
      COUNT: "1"
- tapOn: "Back"
- assertVisible:
    id: "moment-generating"
    text: "1 new piece"
- takeScreenshot: docs/qa/screens/capture/restart-pending
- stopApp
- launchApp
- tapOn: "Closet"
- extendedWaitUntil:
    visible:
      id: "progress-card"
      text: "1 ready to add, Hijabs & scarves, 1 piece"
    timeout: 120000
- takeScreenshot: docs/qa/screens/capture/restart-ready
- tapOn:
    id: "progress-card"
- assertVisible:
    id: "capture-screen"
