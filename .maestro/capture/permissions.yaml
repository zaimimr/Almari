appId: com.zaimimran.almari
# UC-F02-04
# seed: fresh.sh
---
- launchApp:
    permissions:
      camera: deny
- tapOn: "Closet"
- tapOn: "Add pieces"
- tapOn:
    text: "Got it"
    optional: true
- tapOn: "Take photos"
- assertVisible: "Camera access is off"
- assertVisible: "Open Settings"
- tapOn:
    id: "source-library"
- waitForAnimationToEnd
- tapOn:
    id: "Cancel"
- extendedWaitUntil:
    visible:
      id: "capture-screen"
    timeout: 10000
- assertVisible:
    id: "capture-screen"
