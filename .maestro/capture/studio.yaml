appId: com.zaimimran.almari
# UC-F02-11
# seed: fresh.sh,seed-ready.sh,fixture.sh studio=ok
---
- runFlow: ../lib/open-add.yaml
- tapOn:
    id: "job-ready-1"
- assertVisible:
    id: "confirm-photo"
- tapOn: "Studio"
- assertNotVisible:
    id: "moment-generating"
- tapOn:
    id: "photo-ai-again"
- extendedWaitUntil:
    notVisible:
      id: "moment-generating"
    timeout: 30000
- assertVisible:
    text: "Studio"
    selected: true
- tapOn:
    id: "photo-compare"
- assertVisible:
    id: "photo-comparison"
- takeScreenshot: docs/qa/screens/camera/studio-comparison
- tapOn:
    id: "photo-compare"
- tapOn: "Looks right"
- tapOn:
    id: "job-ready-1"
- assertVisible:
    text: "Studio"
    selected: true
