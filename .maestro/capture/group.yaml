appId: com.zaimimran.almari
# UC-F02-06
# seed: fresh.sh,seed-capture.sh
---
- runFlow: ../lib/open-add.yaml
- extendedWaitUntil:
    visible: "3 pieces in one photo"
    timeout: 120000
- extendedWaitUntil:
    notVisible:
      id: "moment-generating"
    timeout: 120000
- tapOn: "3 pieces in one photo"
- assertVisible:
    id: "region-1"
- takeScreenshot: docs/redesign/screens/after/capture/group
- tapOn:
    id: "group-row-1"
- assertVisible: "Link as a set"
- tapOn:
    id: "group-set-toggle"
- tapOn:
    id: "region-2"
- tapOn: "Smaller"
- tapOn: "Use this box"
- scrollUntilVisible:
    element:
      id: "group-draw"
    centerElement: true
- tapOn:
    id: "group-draw"
- swipe:
    from:
      id: "draw-area"
    direction: RIGHT
- tapOn: "Use this box"
- tapOn: "Done"
- waitForAnimationToEnd
- repeat:
    while:
      visible: "Looks right"
    commands:
      - tapOn: "Looks right"
      - waitForAnimationToEnd
- repeat:
    while:
      visible:
        id: "job-confirm-1"
    commands:
      - tapOn:
          id: "job-confirm-1"
      - waitForAnimationToEnd
      - tapOn: "Looks right"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "capture-add"
    timeout: 60000
- tapOn:
    id: "capture-add"
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: "capture-screen"
    commands:
      - tapOn: "Back"
- scrollUntilVisible:
    element:
      text: "Taupe kaftan.*"
    centerElement: true
- tapOn: "Taupe kaftan.*"
- scrollUntilVisible:
    element:
      id: "piece-set"
    centerElement: true
- assertVisible: "Part of a set"
