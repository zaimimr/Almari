appId: com.zaimimran.almari
# UC-F02-06
# seed: fresh.sh,seed-capture.sh
---
- runFlow: ../lib/open-add.yaml
- extendedWaitUntil:
    visible: "3 pieces in one photo"
    timeout: 120000
- extendedWaitUntil:
    notVisible:
      id: "moment-generating"
    timeout: 120000
- tapOn: "3 pieces in one photo"
- assertVisible:
    id: "region-1"
- takeScreenshot: docs/redesign/screens/after/capture/group
- tapOn:
    id: "group-row-1"
- scrollUntilVisible:
    element:
      id: "group-set-toggle"
    centerElement: true
- tapOn:
    id: "group-set-toggle"
- scrollUntilVisible:
    element:
      id: "region-2"
    direction: UP
    centerElement: true
- longPressOn:
    id: "region-2"
- tapOn: "Use"
- scrollUntilVisible:
    element:
      id: "group-draw"
    centerElement: true
- tapOn:
    id: "group-draw"
- tapOn:
    id: "draw-area"
- extendedWaitUntil:
    visible:
      id: "draw-box"
    timeout: 30000
- tapOn: "Use"
- extendedWaitUntil:
    visible:
      id: "group-card-2"
    timeout: 60000
- tapOn:
    id: "group-card-2"
- extendedWaitUntil:
    visible: "1 of .*"
    timeout: 10000
- assertVisible:
    id: "confirm-next"
- tapOn:
    id: "confirm-next"
- assertVisible: "2 of .*"
- tapOn:
    id: "confirm-previous"
- assertVisible: "1 of .*"
- tapOn: "Cancel"
- extendedWaitUntil:
    visible:
      id: "group-done"
      enabled: true
    timeout: 60000
- tapOn:
    id: "group-done"
- waitForAnimationToEnd
- repeat:
    while:
      visible: "Looks right"
    commands:
      - tapOn: "Looks right"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: "group-screen"
    commands:
      - tapOn:
          id: "group-done"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: "capture-screen"
    commands:
      - tapOn: "Back"
- scrollUntilVisible:
    element:
      text: "Taupe kaftan.*"
    centerElement: true
- tapOn: "Taupe kaftan.*"
- scrollUntilVisible:
    element:
      id: "piece-set"
    centerElement: true
- assertVisible: "Part of a set"
