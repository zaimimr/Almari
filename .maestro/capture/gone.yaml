appId: com.zaimimran.almari
# UC-F02-18
# seed: fresh.sh
---
- launchApp
- openLink: "almari://capture/missing-id"
- repeat:
    times: 3
    while:
      notVisible: "This photo is no longer waiting"
    commands:
      - extendedWaitUntil:
          visible: "This photo is no longer waiting"
          timeout: 3000
          optional: true
      - runFlow:
          when:
            notVisible: "This photo is no longer waiting"
          commands:
            - tapOn:
                point: "68%,54%"
- assertVisible: "This photo is no longer waiting"
- tapOn: "Go back"
