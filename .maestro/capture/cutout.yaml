appId: com.zaimimran.almari
# UC-F02-12
# seed: fresh.sh,seed-ready.sh
---
- runFlow: ../lib/open-add.yaml
- tapOn:
    id: "job-ready-1"
- tapOn:
    id: "confirm-cutout"
- assertVisible: "Adjust cut-out"
- extendedWaitUntil:
    visible:
      id: "cutout-restore"
      enabled: true
    timeout: 30000
- longPressOn:
    id: "cutout-canvas"
- extendedWaitUntil:
    visible: "Piece selected"
    timeout: 20000
- tapOn: "Done"
- extendedWaitUntil:
    visible:
      id: "confirm-screen"
    timeout: 30000
- tapOn:
    id: "confirm-cutout"
- extendedWaitUntil:
    visible:
      id: "cutout-restore"
      enabled: true
    timeout: 30000
- assertVisible:
    id: "cutout-undo"
    enabled: false
