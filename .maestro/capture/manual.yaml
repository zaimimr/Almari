appId: com.zaimimran.almari
# UC-F02-16
# seed: fresh.sh
---
- addMedia:
    - "../../assets/wardrobe/taupe-bag.png"
- runFlow: ../lib/open-add.yaml
- tapOn:
    text: "Got it"
    optional: true
- tapOn: "Add by hand"
- assertVisible:
    id: "manual-slot"
- tapOn: "Choose photo"
- tapOn:
    text: "Photo, [^,]+, [0-9:]+.*"
    index: 0
- tapOn:
    text: "Add|Done|Choose"
    optional: true
- assertVisible:
    id: "manual-photo"
- tapOn: "Bags"
- tapOn: "Handbag"
- scrollUntilVisible:
    element:
      id: "manual-name"
    centerElement: true
- tapOn:
    id: "manual-name"
- eraseText
- inputText: "Taupe bag"
- hideKeyboard
- takeScreenshot: docs/redesign/screens/after/capture/by-hand
- tapOn: "Add to closet"
- tapOn: "Back"
- scrollUntilVisible:
    element:
      text: "Taupe bag.*"
    centerElement: true
