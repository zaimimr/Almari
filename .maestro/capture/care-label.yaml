appId: com.zaimimran.almari
# UC-F02-13
# seed: fresh.sh,seed-ready.sh
---
- addMedia:
    - "../../assets/wardrobe/taupe-bag.png"
- runFlow: ../lib/open-add.yaml
- tapOn:
    id: "job-ready-1"
- scrollUntilVisible:
    element:
      id: "confirm-label"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "confirm-label"
- tapOn: "Choose a photo"
- tapOn:
    text: "Photo, [^,]+, [0-9:]+.*"
    index: 0
- tapOn:
    text: "Add|Done|Choose"
    optional: true
- extendedWaitUntil:
    visible: "Choose a photo|Take another photo"
    timeout: 60000
- scrollUntilVisible:
    element: "Save care label"
    centerElement: true
- tapOn: "Save care label"
- scrollUntilVisible:
    element:
      id: "confirm-label"
    direction: DOWN
    centerElement: true
- assertVisible:
    id: "confirm-label"
    text: "Edit care label"
