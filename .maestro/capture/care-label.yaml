appId: com.zaimimran.almari
# UC-F02-13
# seed: fresh.sh,seed-ready.sh
---
- addMedia:
    - "../../assets/wardrobe/taupe-bag.png"
- runFlow: ../lib/open-add.yaml
- tapOn:
    id: "job-ready-1"
- scrollUntilVisible:
    element:
      id: "confirm-label"
    direction: DOWN
- tapOn:
    id: "confirm-label"
- tapOn: "Choose a photo"
- tapOn:
    text: "Photo, [^,]+, [0-9:]+.*"
    index: 0
- tapOn:
    text: "Add|Done|Choose"
    optional: true
- extendedWaitUntil:
    visible: "Save care label"
    timeout: 60000
- tapOn: "Save care label"
- scrollUntilVisible:
    element:
      id: "confirm-label"
    direction: DOWN
- assertVisible: "Edit"
