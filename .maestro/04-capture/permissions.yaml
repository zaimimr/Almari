appId: com.zaimimran.almari
env:
  SUFFIX: ""
---
- launchApp:
    permissions:
      camera: deny
      photos: deny
- tapOn: "Closet"
- tapOn: "Add pieces"
- tapOn:
    text: "Skip"
    optional: true
- tapOn: "Take a photo"
- assertVisible: "Camera access is off.*"
- assertVisible: "Open Settings"
- assertVisible: "Choose photos instead"
- takeScreenshot: planning/build/04-capture/camera-off${SUFFIX}
- tapOn: "Choose photos instead"
- assertVisible: "Cancel"
- takeScreenshot: planning/build/04-capture/library-without-permission${SUFFIX}
- tapOn: "Cancel"
- assertVisible: "Take a photo"
