appId: com.zaimimran.almari
env:
  SUFFIX: ""
---
- launchApp
- tapOn: "Closet"
- tapOn: "Select"
- assertVisible: "Choose the pieces of one set, like a kurta, shalwar and dupatta."
- scrollUntilVisible:
    element:
      text: "Sage embroidered kurta.*"
    direction: DOWN
    centerElement: true
    visibilityPercentage: 50
    timeout: 60000
- tapOn: "Sage embroidered kurta.*"
- scrollUntilVisible:
    element:
      text: "Ivory cotton shalwar.*"
    direction: DOWN
    centerElement: true
    visibilityPercentage: 50
    timeout: 60000
- tapOn: "Ivory cotton shalwar.*"
- takeScreenshot: planning/build/04-capture/select-set${SUFFIX}
- repeat:
    while:
      notVisible: "These belong together"
    times: 8
    commands:
      - swipe:
          direction: DOWN
- tapOn: "These belong together"
- assertVisible: "Linked as a set.*"
- scrollUntilVisible:
    element:
      text: "Sage embroidered kurta.*"
    direction: DOWN
    centerElement: true
    visibilityPercentage: 50
    timeout: 60000
- tapOn: "Sage embroidered kurta.*"
- scrollUntilVisible:
    element:
      text: "Remove from this set"
    direction: DOWN
- assertVisible: "Part of a set"
- assertVisible: "Ivory cotton shalwar"
- takeScreenshot: planning/build/04-capture/piece-set${SUFFIX}
- tapOn: "Remove from this set"
- assertNotVisible: "Part of a set"
