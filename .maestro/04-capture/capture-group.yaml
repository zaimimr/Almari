appId: com.zaimimran.almari
env:
  SUFFIX: ""
---
- launchApp
- tapOn: "Closet"
- tapOn: "Add pieces"
- tapOn:
    text: "Skip"
    optional: true
- extendedWaitUntil:
    notVisible: "Preparing"
    timeout: 120000
- scrollUntilVisible:
    element:
      text: "3 pieces found in one photo"
    direction: DOWN
- tapOn: "Review"
- assertVisible: "Other people were in this photo.*"
- scrollUntilVisible:
    element:
      text: "Partly visible"
    direction: DOWN
- takeScreenshot: planning/build/04-capture/group${SUFFIX}
- scrollUntilVisible:
    element:
      text: "Drop, Charcoal.*"
    direction: DOWN
    centerElement: true
- tapOn: "Drop, Charcoal.*"
- scrollUntilVisible:
    element:
      text: "Add a piece"
    direction: DOWN
    centerElement: true
- tapOn: "Add a piece"
- assertVisible: "Drag across the photo.*"
- swipe:
    start: 30%, 30%
    end: 70%, 55%
- takeScreenshot: planning/build/04-capture/draw-box${SUFFIX}
- tapOn: "Use this box"
- scrollUntilVisible:
    element:
      text: "4\\. .*"
    direction: DOWN
- tapOn: "Done"
- scrollUntilVisible:
    element:
      text: "3 pieces found in one photo"
    direction: DOWN
- scrollUntilVisible:
    element:
      text: ".*, Quick check"
      index: 0
    direction: DOWN
    centerElement: true
- tapOn:
    text: ".*, Quick check"
    index: 0
- scrollUntilVisible:
    element:
      text: "Only part of this piece shows.*"
    direction: DOWN
- assertVisible: "Partly visible"
- takeScreenshot: planning/build/04-capture/partial${SUFFIX}
