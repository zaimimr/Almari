appId: com.zaimimran.almari
# UC-F10-07
# seed: seed-closet.sh
---
- runFlow: ../lib/open-closet.yaml
- tapOn:
    id: "header-select"
- tapOn:
    id: "tile-seed-chiffon-hijab"
- tapOn:
    id: "tile-seed-hijab"
- tapOn:
    id: "select-new-look"
- extendedWaitUntil:
    visible: "New look"
    timeout: 20000
- assertVisible:
    id: "outfit-piece-seed-hijab"
- tapOn: "Save look"
- extendedWaitUntil:
    visible:
      id: "closet-grid"
    timeout: 20000
