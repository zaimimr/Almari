appId: com.zaimimran.almari
# UC-F10-01
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- runFlow: ../lib/sample-closet.yaml
- extendedWaitUntil:
    visible: "Looks"
    timeout: 60000
- tapOn: "Looks"
- tapOn:
    id: "header-new"
- extendedWaitUntil:
    visible: "New look"
    timeout: 20000
- tapOn:
    id: "build-occasion"
- tapOn: "Eid"
- tapOn:
    id: "build-piece-sample-.*-hijab.*"
    index: 0
- tapOn:
    id: "build-piece-sample-.*(kurta|tunic|top).*"
    index: 0
- tapOn:
    id: "build-piece-sample-.*(trousers|salwar|skirt).*"
    index: 0
- tapOn:
    id: "build-piece-sample-.*(shoes|flats|sandals|sneakers).*"
    index: 0
- assertVisible:
    id: "outfit-piece-sample-.*hijab.*"
- takeScreenshot: docs/redesign/screens/after/build-look/build
- tapOn: "Save look"
- extendedWaitUntil:
    visible: ".*Eid.*"
    timeout: 20000
