appId: com.zaimimran.almari
# UC-F10-06
# seed: seed-closet.sh,fixture.sh failWrite=true
---
- runFlow: ../lib/open-closet.yaml
- tapOn:
    id: "header-select"
- tapOn:
    id: "tile-seed-hijab"
- tapOn:
    id: "select-new-look"
- extendedWaitUntil:
    visible: "New look"
    timeout: 20000
- tapOn: "Save look"
- extendedWaitUntil:
    visible: "Could not save. Try again."
    timeout: 20000
