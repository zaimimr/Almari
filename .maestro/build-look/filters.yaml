appId: com.zaimimran.almari
# UC-F10-04
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- runFlow: ../lib/skip-onboarding.yaml
- extendedWaitUntil:
    visible: "Looks"
    timeout: 60000
- tapOn: "Looks"
- tapOn:
    id: "header-new"
- extendedWaitUntil:
    visible: "Add pieces"
    timeout: 20000
- tapOn: "Add pieces"
- tapOn: "Back"
- extendedWaitUntil:
    visible: "New look"
    timeout: 20000
