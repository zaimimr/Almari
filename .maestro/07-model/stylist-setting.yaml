appId: com.zaimimran.almari
---
- launchApp
- runFlow:
    when:
      visible: "Try a sample style"
    commands:
      - tapOn: "Try a sample style"
- scrollUntilVisible:
    element: "Style settings"
    speed: 90
    timeout: 180000
- tapOn: "Style settings"
- scrollUntilVisible:
    element:
      text: "Compare"
    speed: 90
    timeout: 180000
- tapOn: "Compare"
- scrollUntilVisible:
    element: "Compare takes turns between Rules and Model for each new suggestion. Today does not show which one styled an outfit."
    visibilityPercentage: 10
    speed: 90
    timeout: 180000
- takeScreenshot: planning/build/model/style-settings-stylist${SUFFIX}
- scrollUntilVisible:
    element:
      text: "Compare results"
    visibilityPercentage: 10
    speed: 60
    timeout: 180000
- tapOn: "Compare results"
- scrollUntilVisible:
    element: "Western"
    visibilityPercentage: 10
    speed: 60
    timeout: 180000
- scrollUntilVisible:
    element: "Desi"
    visibilityPercentage: 10
    speed: 60
    timeout: 180000
- scrollUntilVisible:
    element: "Rules"
    visibilityPercentage: 10
    speed: 60
    timeout: 180000
- takeScreenshot: planning/build/model/compare-results${SUFFIX}
- scrollUntilVisible:
    element: "Model"
    visibilityPercentage: 10
    speed: 60
    timeout: 180000
- swipe:
    start: 50%, 12%
    end: 50%, 90%
- scrollUntilVisible:
    element: "Save style settings"
    speed: 90
    timeout: 180000
- tapOn: "Save style settings"
