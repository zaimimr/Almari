appId: com.zaimimran.almari
---
- launchApp
- runFlow:
    when:
      visible: "Try a sample style"
    commands:
      - tapOn: "Try a sample style"
- scrollUntilVisible:
    element: "Not for me"
- assertNotVisible: "Rules"
- assertNotVisible: "Model"
- tapOn:
    text: "Change"
    index: 0
- scrollUntilVisible:
    element: "A little inspiration for today."
    direction: UP
- assertNotVisible: "Rules"
- assertNotVisible: "Model"
- takeScreenshot: planning/build/model/today-compare
