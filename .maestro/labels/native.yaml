appId: com.zaimimran.almari
---
- launchApp
- tapOn: "Closet"
- tapOn: "Add pieces"
- tapOn:
    text: "Skip"
    optional: true
- tapOn: "Choose photos"
- tapOn:
    text: "Photo, [^,]+, [0-9:]+.*"
    index: 0
- tapOn: "Add|Done"
- extendedWaitUntil:
    visible: ".*, Quick check"
    timeout: 60000
- tapOn: ".*, Quick check"
- scrollUntilVisible:
    element: "Kurta"
- assertVisible: "Kurta"
- takeScreenshot: planning/build/labels/native-kurta
