appId: com.zaimimran.almari
---
- launchApp
- tapOn: "Closet"
- tapOn: "Add pieces"
- scrollUntilVisible:
    element: "Choose photos"
- tapOn: "Choose photos"
- tapOn:
    text: "Photo, [^,]+, [0-9:]+.*"
    index: 0
- tapOn: "Add|Done"
- scrollUntilVisible:
    element: ".*, Quick check"
    timeout: 60000
- tapOn: ".*, Quick check"
- takeScreenshot: planning/build/labels/large-text-check-piece
- scrollUntilVisible:
    element: "Remove this photo"
    visibilityPercentage: 50
- takeScreenshot: planning/build/labels/large-text-check-piece-end
- tapOn: "Remove this photo"
- tapOn: "Close"
- scrollUntilVisible:
    element: "Sage embroidered kurta.*"
- tapOn: "Sage embroidered kurta.*"
- tapOn: "Edit"
- scrollUntilVisible:
    element: "Style"
- takeScreenshot: planning/build/labels/large-text-editor
