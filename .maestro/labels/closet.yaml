appId: com.zaimimran.almari
---
- launchApp
- tapOn: "Closet"
- assertVisible: "All"
- assertVisible: "Hijabs & scarves"
- takeScreenshot: planning/build/labels/closet-chips
- tapOn: "Try a name, like mauve hijab"
- inputText: "longline"
- hideKeyboard
- assertVisible: "Ivory longline tunic.*"
- tapOn: "Desi"
- assertVisible: "No pieces found"
- assertVisible: "Try another name or filter."
- takeScreenshot: planning/build/labels/closet-no-match
- tapOn: "Desi"
- assertVisible: "Ivory longline tunic.*"
- tapOn: "Layers"
- assertVisible: "Navy longline blazer.*"
- assertNotVisible: "Ivory longline tunic.*"
- swipe:
    from: "Western"
    direction: LEFT
- tapOn: "Unavailable"
- assertVisible: "No pieces found"
- tapOn: "Clear filters"
- assertNotVisible: "No pieces found"
- assertVisible: "All"
