appId: com.zaimimran.almari
---
- launchApp
- tapOn: "Closet"
- scrollUntilVisible:
    element: "Sage embroidered kurta, Kurtas & tunics · Kurta"
- assertVisible: "Sage embroidered kurta, Kurtas & tunics · Kurta"
- tapOn: "Sage embroidered kurta.*"
- tapOn: "Edit"
- scrollUntilVisible:
    element: "Subcategory \\(optional\\)"
- scrollUntilVisible:
    element: "Desi, set by the subcategory"
- assertVisible: "Desi, set by the subcategory"
- takeScreenshot: planning/build/labels/editor-sample
- tapOn: "Back"
- tapOn: "Back"
- scrollUntilVisible:
    element: "Kurti.*"
    direction: UP
- tapOn: "Kurti.*"
- tapOn: "Edit"
- scrollUntilVisible:
    element: "Subcategory"
- tapOn: "Tops"
- scrollUntilVisible:
    element: "Choose a subcategory to save this piece."
- assertVisible: "Choose a subcategory to save this piece."
- scrollUntilVisible:
    element: "Save changes"
- assertVisible:
    text: "Save changes"
    enabled: false
- tapOn: "Blouse"
- assertVisible:
    text: "Desi"
    selected: false
- tapOn: "Western"
- takeScreenshot: planning/build/labels/editor-owned
- scrollUntilVisible:
    element: "Save changes"
- tapOn: "Save changes"
- tapOn: "Back"
- assertVisible: ".*Tops · Blouse.*"
- takeScreenshot: planning/build/labels/closet-cards
