appId: com.zaimimran.almari
name: Care label with larger text
---
- launchApp
- tapOn: "Closet"
- scrollUntilVisible:
    element: "Label test dress.*"
    direction: DOWN
- tapOn: "Label test dress.*"
- scrollUntilVisible:
    element: "View or edit care label"
    direction: DOWN
- takeScreenshot: planning/build/care-label/piece-large-text
- tapOn: "View or edit care label"
- assertVisible: "What it is made of"
- takeScreenshot: planning/build/care-label/label-large-text
- scrollUntilVisible:
    element: "Save care label"
    direction: DOWN
- takeScreenshot: planning/build/care-label/label-large-text-bottom
