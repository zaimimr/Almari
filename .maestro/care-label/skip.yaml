appId: com.zaimimran.almari
name: Skip the care label
---
- launchApp
- tapOn: "Closet"
- tapOn: "Add pieces"
- tapOn:
    text: "Skip"
    optional: true
- tapOn: "Choose photos"
- tapOn:
    text: "Photo, [^,]+, [0-9:]+.*"
    index: 1
- tapOn: "Add|Done"
- extendedWaitUntil:
    visible: ".*, Quick check"
    timeout: 60000
- tapOn: ".*, Quick check"
- scrollUntilVisible:
    element: "Looks right"
    direction: DOWN
- tapOn: "Looks right"
- assertVisible: "Add the care label?"
- tapOn: "Skip"
- assertVisible: "Add .* ready .*"
- takeScreenshot: planning/build/care-label/skipped
- tapOn: "Add .* ready .*"
