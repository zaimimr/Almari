appId: com.zaimimran.almari
name: Care label on the piece screen
---
- launchApp
- tapOn: "Closet"
- tapOn: "Label test dress.*"
- scrollUntilVisible:
    element: "View or edit care label"
    direction: DOWN
- assertVisible: "95% cotton, 5% elastane"
- assertVisible: "Size S"
- takeScreenshot: planning/build/care-label/piece-care-label
- tapOn: "View or edit care label"
- scrollUntilVisible:
    element:
      id: "care-label-size"
    direction: DOWN
- tapOn:
    id: "care-label-size"
- eraseText
- inputText: "M"
- hideKeyboard
- scrollUntilVisible:
    element: "Save care label"
    direction: DOWN
- tapOn: "Save care label"
- scrollUntilVisible:
    element: "Size M"
    direction: DOWN
- assertVisible: "Size M"
- tapOn: "Edit"
- tapOn:
    id: "piece-name"
- eraseText
- inputText: "Label test dress two"
- hideKeyboard
- scrollUntilVisible:
    element: "Save changes"
    direction: DOWN
- tapOn: "Save changes"
- assertVisible: "Label test dress two"
- scrollUntilVisible:
    element: "Size M"
    direction: DOWN
- assertVisible: "95% cotton, 5% elastane"
- tapOn: "View or edit care label"
- scrollUntilVisible:
    element: "Remove care label"
    direction: DOWN
- tapOn: "Remove care label"
- tapOn: "Remove"
- scrollUntilVisible:
    element: "Add care label"
    direction: DOWN
- assertNotVisible: "Size M"
- takeScreenshot: planning/build/care-label/piece-label-removed
