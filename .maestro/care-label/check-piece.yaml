appId: com.zaimimran.almari
name: Care label from Check this piece
---
- launchApp
- tapOn: "Closet"
- tapOn: "Add pieces"
- tapOn:
    text: "Skip"
    optional: true
- tapOn: "Choose photos"
- tapOn:
    text: "Photo, [^,]+, [0-9:]+.*"
    index: 1
- tapOn: "Add|Done"
- extendedWaitUntil:
    visible: ".*, Quick check"
    timeout: 60000
- tapOn: ".*, Quick check"
- scrollUntilVisible:
    element:
      id: "check-name"
    direction: DOWN
- tapOn:
    id: "check-name"
- eraseText
- inputText: "Label test dress"
- hideKeyboard
- scrollUntilVisible:
    element: "Looks right"
    direction: DOWN
- tapOn: "Looks right"
- assertVisible: "Add the care label?"
- takeScreenshot: planning/build/care-label/check-piece-offer
- tapOn: "Add care label"
- assertVisible: "Choose a photo"
- takeScreenshot: planning/build/care-label/label-empty
- tapOn: "Choose a photo"
- tapOn:
    text: "Photo, [^,]+, [0-9:]+.*"
    index: 0
- extendedWaitUntil:
    visible: "What it is made of"
    timeout: 30000
- assertVisible: "cotton"
- takeScreenshot: planning/build/care-label/label-read
- scrollUntilVisible:
    element: "elastane"
    direction: DOWN
- scrollUntilVisible:
    element: "Save care label"
    direction: DOWN
- tapOn: "Save care label"
- assertVisible: "95% cotton, 5% elastane"
- assertVisible: "Size S"
- takeScreenshot: planning/build/care-label/check-piece-labelled
- tapOn: "Done"
- tapOn: "Add .* ready .*"
- tapOn:
    text: "Close"
    optional: true
- assertVisible: "Label test dress.*"
