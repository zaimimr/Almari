appId: com.zaimimran.almari
# UC-F03-04
# seed: fixture.sh scan=kameez-dupatta
---
- runFlow: ../lib/open-scan.yaml
- extendedWaitUntil:
    visible: "2 scanned: Sage kurta, Ivory chiffon hijab"
    timeout: 40000
- tapOn: "Done"
- extendedWaitUntil:
    visible:
      id: "group-card-2"
    timeout: 20000
- takeScreenshot: docs/redesign/screens/after/scan/scanned
- tapOn: "Link as a set"
- tapOn: "Add 2 pieces"
- repeat:
    while:
      visible: "Looks right"
    times: 2
    commands:
      - tapOn: "Looks right"
- runFlow:
    when:
      visible: "Add 2 pieces"
    commands:
      - tapOn: "Add 2 pieces"
- extendedWaitUntil:
    visible: "2 added"
    timeout: 20000
- tapOn:
    id: "header-add"
- tapOn: "Scan"
- extendedWaitUntil:
    visible: "Hold up a piece"
    timeout: 20000
- tapOn: "Back"
- assertVisible: "Add pieces"
