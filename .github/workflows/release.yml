name: release

# Builds Almari with Xcode (no Expo account, no EAS credits) and ships it to
# TestFlight. Runs only when started by hand. App Store review stays manual.
# See docs/RELEASE_CI.md.

on:
  workflow_dispatch:
    inputs:
      submission:
        description: Also stage an App Store submission for you to approve by hand
        type: choice
        default: none
        options: [none, staged]

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  # One build number per release, written into the repo and tagged.
  prepare:
    name: open the release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      build: ${{ steps.open.outputs.build }}
      version: ${{ steps.open.outputs.version }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bump the version and the build number
        id: open
        run: node scripts/ci/start-release.mjs

      - name: Commit and tag
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.json release.json store/release-notes
          git commit -m "chore: release ${{ steps.open.outputs.version }} (${{ steps.open.outputs.build }})"
          # --follow-tags only carries annotated tags.
          git tag -a "v${{ steps.open.outputs.version }}+${{ steps.open.outputs.build }}" \
            -m "${{ steps.open.outputs.version }} (${{ steps.open.outputs.build }})"
          git push origin HEAD:${{ github.ref_name }} --follow-tags
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  ios:
    name: ios -> TestFlight
    needs: prepare
    # Xcode 26 for the iOS 26 deployment target.
    runs-on: macos-26
    timeout-minutes: 90
    env:
      APPLE_TEAM_ID: 9L246T935B
      ASC_KEY_ID: 734B75F2PY
      ASC_ISSUER_ID: a2d1bd8d-dc23-4161-904a-9f088eef8144
      PROFILE_NAME: ${{ vars.IOS_PROVISIONING_PROFILE_NAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Fail fast on missing secrets
        run: |
          missing=""
          [ -n "${{ secrets.IOS_DIST_P12_BASE64 }}" ] || missing="$missing IOS_DIST_P12_BASE64"
          [ -n "${{ secrets.IOS_DIST_P12_PASSWORD }}" ] || missing="$missing IOS_DIST_P12_PASSWORD"
          [ -n "${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}" ] || missing="$missing IOS_PROVISIONING_PROFILE_BASE64"
          [ -n "${{ secrets.ASC_KEY_P8 }}" ] || missing="$missing ASC_KEY_P8"
          [ -n "$PROFILE_NAME" ] || missing="$missing IOS_PROVISIONING_PROFILE_NAME(variable)"
          if [ -n "$missing" ]; then
            echo "::error::missing secrets:$missing"
            exit 1
          fi

      - name: Show the Xcode in use
        run: xcodebuild -version

      - name: Install dependencies
        run: npm ci

      - name: Import the signing certificate
        env:
          IOS_DIST_P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/almari-signing.keychain-db"
          password="$(uuidgen)"
          printf '%s' "$IOS_DIST_P12_BASE64" | base64 -d > "$RUNNER_TEMP/dist.p12"

          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/dist.p12" -k "$keychain" -P "$IOS_DIST_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/dist.p12"

          # Pin whichever identity was imported: "Apple" or legacy "iPhone" Distribution.
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | grep -oE '"(Apple|iPhone) Distribution: [^"]+"' | head -1 | tr -d '"')"
          [ -n "$identity" ] || { echo "::error::no distribution identity in the keychain"; exit 1; }
          echo "CODE_SIGN_IDENTITY_NAME=$identity" >> "$GITHUB_ENV"
          echo "signing as: $identity"

      - name: Install the provisioning profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$dir"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -d > "$dir/almari-ci.mobileprovision"
          security cms -D -i "$dir/almari-ci.mobileprovision" | plutil -p - | grep -E '"Name"|ExpirationDate'

      - name: Prebuild the iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Stamp version and build number
        run: node scripts/ci/apply-build-number.mjs "${{ needs.prepare.outputs.build }}"

      - name: Archive
        run: |
          xcodebuild archive \
            -workspace ios/Almari.xcworkspace \
            -scheme Almari \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Almari.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_IDENTITY="$CODE_SIGN_IDENTITY_NAME" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"

      - name: Export the IPA
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.zaimimran.almari</key><string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Almari.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - name: Verify the artifact
        run: |
          ipa="$(ls "$RUNNER_TEMP/export"/*.ipa 2>/dev/null | head -1)"
          test -n "$ipa" && test -s "$ipa" || { echo "::error::no IPA produced"; exit 1; }
          echo "IPA_PATH=$ipa" >> "$GITHUB_ENV"
          ls -lh "$ipa"

      - name: Upload to TestFlight
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s' "$ASC_KEY_P8" | base64 -d > "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8"
          xcrun altool --upload-app --type ios \
            --file "$IPA_PATH" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Keep the build for 14 days
        uses: actions/upload-artifact@v4
        with:
          name: almari-ios-${{ github.sha }}
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 14
          if-no-files-found: error

      - name: Shred the credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/almari-signing.keychain-db" || true
          rm -f "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8"
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/almari-ci.mobileprovision"

  # Apple takes 10 to 20 minutes to process an upload, so wait on cheap Linux.
  ios-submission:
    name: ios -> staged for review
    needs: [prepare, ios]
    if: inputs.submission == 'staged'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ASC_KEY_ID: 734B75F2PY
      ASC_ISSUER_ID: a2d1bd8d-dc23-4161-904a-9f088eef8144
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The runner context is not readable from job-level env.
      - name: Stage the App Store submission
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_PATH: ${{ runner.temp }}/asc-key.p8
        run: |
          printf '%s' "$ASC_KEY_P8" | base64 -d > "$ASC_KEY_PATH"
          node scripts/ci/asc-prepare-submission.mjs "${{ needs.prepare.outputs.build }}"

      - name: Shred the credentials
        if: always()
        run: rm -f "${{ runner.temp }}/asc-key.p8"
