name: release

on:
  workflow_dispatch:
    inputs:
      submission:
        description: Also stage an App Store submission for you to approve by hand
        type: choice
        default: none
        options: [none, staged]

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  prepare:
    name: open the release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.open.outputs.version }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bump the version
        id: open
        run: node scripts/ci/start-release.mjs

      - name: Commit and tag
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.json store/release-notes
          git commit -m "chore: release ${{ steps.open.outputs.version }}"
          # --follow-tags only carries annotated tags.
          git tag -a "v${{ steps.open.outputs.version }}" -m "${{ steps.open.outputs.version }}"
          git push origin HEAD:${{ github.ref_name }} --follow-tags
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  ios-submission:
    name: ios -> staged for review
    needs: prepare
    if: inputs.submission == 'staged'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      ASC_KEY_ID: 734B75F2PY
      ASC_ISSUER_ID: a2d1bd8d-dc23-4161-904a-9f088eef8144
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The runner context is not readable from job-level env.
      - name: Stage the App Store submission
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_PATH: ${{ runner.temp }}/asc-key.p8
        run: |
          printf '%s' "$ASC_KEY_P8" | base64 -d > "$ASC_KEY_PATH"
          node scripts/ci/asc-prepare-submission.mjs

      - name: Shred the credentials
        if: always()
        run: rm -f "${{ runner.temp }}/asc-key.p8"
